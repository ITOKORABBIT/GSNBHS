<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告管理 - 舊社里 里民小幫手</title>
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="公告管理 - 舊社里 里民小幫手">
<meta property="og:description" content="舊社里公告管理頁面">
<meta property="og:url" content="https://gsnbhs.pages.dev/bulletinlist">
<meta property="og:image" content="https://gsnbhs.pages.dev/圖庫/S__27246628_0.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="484">
<meta property="og:image:height" content="163">
<link rel="icon" type="image/jpeg" href="./圖庫/S__27246628_0.jpg?v=20260816">
<link rel="shortcut icon" href="./圖庫/S__27246628_0.jpg?v=20260816">
<link rel="apple-touch-icon" href="./圖庫/S__27246628_0.jpg?v=20260816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:#f3f0ea;
  color:#2b231b;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
  --card:#fff;
  --border:#e4d9ce;
  --muted:#8d7968;
  --text:#2b231b;
  --heading:#18120d;
  --accent:#b95353;
  --accent-soft:#fff1ef;
  --green:#2f6836;
  --green-soft:#eaf3eb;
  --gold:#9b6112;
  --gold-soft:#fff4df;
  --gray:#6f645a;
  --gray-soft:#f2efea;
  --shadow:0 14px 40px rgba(43,35,27,.08);
  --radius:18px;
}

.login-shell{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px 16px;
}
.login-card{
  width:min(100%,420px);
  padding:30px 26px;
  border:1px solid var(--border);
  border-radius:24px;
  background:#fff;
  box-shadow:var(--shadow);
}
.login-badge{
  display:inline-flex;
  align-items:center;
  padding:8px 12px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:12px;
  font-weight:800;
  margin-bottom:16px;
}
.login-title{
  font-size:28px;
  font-weight:800;
  color:var(--heading);
  margin-bottom:10px;
}
.login-sub{
  color:var(--muted);
  line-height:1.7;
  margin-bottom:22px;
}
.login-error{
  display:none;
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:14px;
}

.page{
  max-width:1280px;
  margin:0 auto;
  padding:24px 20px 40px;
}
.topbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:20px;
  padding:22px 24px;
  border:1px solid rgba(228,217,206,.8);
  border-radius:24px;
  background:
    radial-gradient(circle at top right, rgba(185,83,83,.08), transparent 34%),
    linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,251,247,.92));
  box-shadow:var(--shadow);
}
.title-wrap h1{
  font-size:32px;
  font-weight:800;
  color:var(--heading);
  margin-bottom:8px;
}
.title-wrap p{color:var(--muted);line-height:1.7}
.top-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  padding:11px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fff;
  font-weight:700;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(43,35,27,.08)}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.btn.ghost{
  background:#fbf7f2;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:20px;
  align-items:start;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel{
  padding:20px;
}
.editor-panel.collapsed{
  display:none;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}
.search{
  flex:1;
  min-width:220px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
}
.pill-group{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  padding:9px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.pill.active{
  background:var(--accent-soft);
  border-color:transparent;
  color:var(--accent);
}

.list-wrap{padding:4px 0}
.group-header{
  display:flex;align-items:center;gap:8px;
  padding:14px 4px 6px;
  font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;
}
.group-header:first-child{padding-top:4px}
.group-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.bull-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border:1px solid var(--border);border-radius:14px;background:#fff;
  transition:transform .15s,box-shadow .15s;
}
.bull-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(43,35,27,.08)}
.bull-drag-handle{
  flex:0 0 auto;color:var(--muted);cursor:grab;
  font-size:17px;opacity:.45;user-select:none;padding:2px 4px;
}
.bull-drag-handle:active{cursor:grabbing}
.bull-item-body{flex:1;min-width:0}
.bull-item-title{font-weight:800;color:var(--heading);margin-bottom:4px;word-break:break-all}
.bull-item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.bull-item-preview{font-size:13px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bull-item-actions{display:flex;flex-wrap:nowrap;gap:8px;flex:0 0 auto}
.sortable-ghost{opacity:.4}
.sortable-drag{box-shadow:0 8px 24px rgba(43,35,27,.18)!important}
.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.badge-published{background:var(--green-soft);color:var(--green)}
.badge-draft{background:var(--gold-soft);color:var(--gold)}
.badge-pinned{background:var(--gray-soft);color:var(--gray)}
.inline-btn{
  padding:8px 10px;
  border:none;
  border-radius:10px;
  background:#f7f3ee;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.editor-modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(43,35,27,.32);
  backdrop-filter:blur(6px);
  z-index:200;
}
.editor-modal.open{display:flex}
.editor-panel{
  width:min(100%,920px);
  max-height:min(92vh,980px);
  overflow:auto;
}

.editor-head{
  position:sticky;
  top:0;
  background:var(--card);
  z-index:10;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  padding-bottom:16px;
  margin-bottom:2px;
  border-bottom:1px solid var(--border);
}
.editor-head-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.editor-close{
  width:42px;
  height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  color:var(--muted);
  transition:background .18s ease, color .18s ease, transform .18s ease;
}
.editor-close:hover{
  background:#f8f2ec;
  color:var(--heading);
  transform:translateY(-1px);
}
.editor-close svg{
  width:18px;
  height:18px;
}
.editor-title{font-size:24px;font-weight:800;color:var(--heading)}
.editor-sub{margin-top:6px;color:var(--muted);line-height:1.7}
.form-section{margin-bottom:16px}
.label{
  display:block;
  margin-bottom:6px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.input,.textarea,.select{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
}
.textarea{min-height:160px;resize:vertical;line-height:1.8}
.hidden-field{display:none}
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.editor-toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.editor-btn{
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.editor-btn:hover{
  background:#faf6f1;
  color:var(--heading);
}
.rich-editor{
  min-height:180px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  line-height:1.8;
  color:var(--text);
  outline:none;
}
.rich-editor:empty:before{
  content:attr(data-placeholder);
  color:var(--muted);
}
.rich-editor h2,.rich-editor h3{
  color:var(--heading);
  margin:0 0 .6em;
}
.rich-editor p{margin:0 0 .9em}
.rich-editor ul,.rich-editor ol{padding-left:1.4em;margin:0 0 .9em}
.rich-editor blockquote{
  margin:0 0 .9em;
  padding-left:12px;
  border-left:3px solid var(--border);
  color:var(--muted);
}
.rich-editor a{color:var(--accent)}
.upload-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}
.upload-input{
  display:none;
}
.upload-meta{
  flex:1;
  min-width:220px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fcfaf7;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  overflow:hidden;
}
.upload-meta strong{
  color:var(--heading);
}
.upload-list{
  margin-top:6px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.upload-item{
  display:flex;
  align-items:center;
  gap:8px;
  max-width:100%;
}
.upload-link{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.upload-remove{
  flex:0 0 auto;
  padding:4px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  color:#b0584d;
  font-size:12px;
  font-weight:700;
}
.upload-remove:hover{background:#fff4f2}
.upload-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}
.upload-note{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}
.toggle-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fcf8f4;
}
.preview-box{
  margin-top:16px;
  padding:16px;
  border:1px dashed var(--border);
  border-radius:14px;
  background:linear-gradient(180deg, #fffdfb, #fff8f2);
}
.preview-gallery{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px;
}
.preview-gallery img{
  width:100%;
  height:auto;
  border-radius:12px;
  display:block;
}
.form-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}
.hint{
  padding:14px 16px;
  border-radius:14px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:14px;
  line-height:1.7;
  margin-bottom:16px;
}
.success{
  background:var(--green-soft);
  color:var(--green);
}
.empty{
  padding:44px 20px;
  text-align:center;
  color:var(--muted);
}
.empty h3{font-size:18px;color:var(--heading);margin-bottom:8px}

@media (max-width: 980px){
  .layout{grid-template-columns:1fr}
}
@media (max-width: 720px){
  .page{padding:18px 14px 30px}
  .topbar{padding:18px}
  .editor-modal{padding:12px}
  .grid-2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="login-shell" id="loginScreen">
  <div class="login-card">
    <div class="login-badge">活動公告欄</div>
    <div class="login-title">公告管理</div>
    <div class="login-sub">這裡是里長使用的公告發布頁。請使用已授權的 Google 帳號登入。</div>
    <div id="loginBtnWrap"></div>
    <div class="login-error" id="loginError">登入失敗，或此帳號尚未被加入管理名單。</div>
  </div>
</div>

<div class="page" id="appShell" style="display:none">
  <div class="topbar">
    <div class="title-wrap">
      <h1>公告管理</h1>
      <p>這裡負責新增、編輯、發布與刪除活動公告。「公佈欄公開頁」只會顯示狀態為「已發布」的公告。</p>
    </div>
    <div class="top-actions">
      <a class="btn" href="admin.html?tab=bulletins">回管理後台</a>
      <a class="btn" href="bulletin.html" target="_blank" rel="noopener">查看里民前台</a>
      <button class="btn primary" onclick="createBulletin()">新增公告</button>
    </div>
  </div>

  <div class="layout">
    <section class="card panel">
      <div class="toolbar">
        <input class="search" id="searchInput" type="text" placeholder="搜尋標題、內容、建立者…" oninput="renderBulletins()">
        <div class="pill-group" id="statusPills"></div>
      </div>
      <div class="list-wrap" id="listWrap"></div>
    </section>
  </div>

  <div class="editor-modal" id="editorModal" onclick="handleEditorBackdrop(event)">
    <section class="card panel editor-panel collapsed" id="editorPanel">
      <div class="editor-head">
        <div>
          <div class="editor-title" id="editorTitle">新增公告</div>
          <div class="editor-sub" id="editorSub">建立新公告後，可先存為未發布，再決定是否發布到里民前台。</div>
        </div>
        <div class="editor-head-actions">
          <button class="editor-close" type="button" onclick="closeEditor()" aria-label="關閉編輯器">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M6 6l12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="hint" id="messageBox" style="display:none"></div>

      <div class="form-section">
        <label class="label" for="titleInput">公告標題</label>
        <input class="input" id="titleInput" type="text" placeholder="例如：五月里民清潔日通知">
      </div>

      <div class="grid-2">
        <div class="form-section">
          <label class="label" for="statusInput">狀態</label>
          <select class="select" id="statusInput">
            <option value="未發布">未發布</option>
            <option value="已發布">已發布</option>
          </select>
        </div>
        <div class="form-section">
          <label class="label" for="categoryInput">公告分類</label>
          <select class="select" id="categoryInput">
            <option value="緊急通告">🚨 緊急通告</option>
            <option value="政策宣導">📋 政策宣導</option>
            <option value="最新消息">📰 最新消息</option>
            <option value="教育課程">📚 教育課程</option>
            <option value="里民活動" selected>🎪 里民活動</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <label class="label" for="contentInput">公告內容</label>
        <div class="editor-toolbar">
          <button class="editor-btn" type="button" onclick="applyEditorCommand('bold')">粗體</button>
          <button class="editor-btn" type="button" onclick="applyEditorCommand('formatBlock','<h2>')">標題</button>
          <button class="editor-btn" type="button" onclick="applyEditorCommand('insertUnorderedList')">項目</button>
          <button class="editor-btn" type="button" onclick="applyEditorCommand('insertOrderedList')">編號</button>
          <button class="editor-btn" type="button" onclick="applyEditorCommand('formatBlock','<blockquote>')">引用</button>
          <button class="editor-btn" type="button" onclick="insertEditorLink()">連結</button>
          <button class="editor-btn" type="button" onclick="applyEditorCommand('removeFormat')">清除格式</button>
        </div>
        <div class="rich-editor" id="contentEditor" contenteditable="true" data-placeholder="請輸入公告內容，可簡單排版。"></div>
        <textarea class="hidden-field" id="contentInput"></textarea>
      </div>

      <div class="form-section">
        <label class="label" for="imageFileInput">公告圖片</label>
        <input class="upload-input" id="imageFileInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple onchange="uploadBulletinImages(this.files)">
        <input id="imageInput" type="hidden">
        <div class="upload-row">
          <button class="btn" type="button" onclick="document.getElementById('imageFileInput').click()">選擇圖片</button>
          <div class="upload-meta" id="imageUploadMeta">尚未上傳圖片</div>
        </div>
        <div class="upload-actions">
          <button class="btn" type="button" id="removeImageBtn" onclick="clearBulletinImage()" style="display:none">移除圖片</button>
        </div>
        <div class="upload-note">圖片會自動上傳到指定雲端資料夾，可一次上傳多張，支援 JPG、PNG、GIF、WEBP，單檔上限 5MB。Facebook 圖片網址會立即轉存到 Drive，不會保存容易失效的原始網址。</div>
        <div class="upload-row" style="margin-top:10px">
          <input class="input" id="imageUrlInput" type="url" placeholder="貼上 Facebook 圖片網址（不是貼文網址）" style="flex:1">
          <button class="btn" type="button" onclick="addImageUrlFromInput()">匯入並轉存</button>
        </div>
      </div>

      <div class="form-section">
        <label class="label" for="linkUrlInput">原始連結（選填）</label>
        <input class="input" id="linkUrlInput" type="url" placeholder="例如臉書貼文網址，LINE 選單「查看詳情」按鈕會連到這裡">
      </div>

      <label class="toggle-row">
        <input type="checkbox" id="pinnedInput">
        <span>設為置頂公告</span>
      </label>

      <div class="preview-box" id="previewBox">
        <strong>預覽摘要</strong>
        <div id="previewTitle" style="margin-top:10px;font-weight:800;color:var(--heading)">尚未輸入標題</div>
        <div id="previewMeta" style="margin-top:8px;color:var(--muted)">狀態：未發布</div>
        <div id="previewContent" style="margin-top:10px;color:var(--muted);line-height:1.8">尚未輸入內容</div>
        <div class="preview-gallery" id="previewGallery" style="display:none"></div>
      </div>

      <div class="form-actions">
        <button class="btn primary" id="saveBtn" onclick="saveBulletin()">儲存公告</button>
        <button class="btn" onclick="resetEditor()">清空編輯器</button>
        <button class="btn" id="deleteBtn" onclick="removeBulletin()" style="display:none">刪除此公告</button>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="./shared/bulletinlist.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
