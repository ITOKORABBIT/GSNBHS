<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}

body{
  background:var(--gs-paper);
  color:var(--gs-ink);
  font-family:var(--gs-font);
  -webkit-font-smoothing:antialiased;
}
.shell{width:min(1180px,calc(100% - 48px));margin-inline:auto}

/* ── 刊頭 ── */
.masthead{border-bottom:1px solid var(--gs-line)}
.masthead-top{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  height:60px;border-bottom:1px solid var(--gs-line-soft);
  font-size:13px;font-weight:600;color:var(--gs-muted);
}
.back-home{display:inline-flex;align-items:center;gap:7px;transition:color .18s ease}
.back-home:hover{color:var(--gs-green)}
.masthead-stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--gs-font-num)}
.masthead-main{padding:34px 0 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap}
.masthead-kicker{display:flex;align-items:center;gap:12px;color:var(--gs-green);font-size:12px;font-weight:800;letter-spacing:.14em}
.masthead-kicker::before{content:"";width:36px;height:1px;background:var(--gs-green)}
.masthead h1{
  margin-top:14px;font-size:clamp(38px,5.4vw,64px);line-height:1.02;
  letter-spacing:-.05em;font-weight:900;color:var(--gs-ink-strong);
}
.masthead-lead{max-width:420px;color:var(--gs-ink-soft);font-size:14px;line-height:1.85;padding-bottom:6px}

/* ── 分類導覽 ── */
.cate-nav{position:sticky;top:0;z-index:20;background:var(--gs-paper);border-bottom:1px solid var(--gs-line)}
.cate-tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.cate-tabs::-webkit-scrollbar{display:none}
.cate-tab{
  flex-shrink:0;padding:16px 0 13px;border-bottom:3px solid transparent;
  color:var(--gs-muted);font-size:15px;font-weight:700;white-space:nowrap;
  transition:color .18s ease,border-color .18s ease;
}
.cate-tab:hover{color:var(--gs-green)}
.cate-tab[aria-selected=true]{color:var(--gs-green);border-bottom-color:var(--gs-green)}
.cate-tab .n{margin-left:6px;font-family:var(--gs-font-num);font-size:12px;color:var(--gs-faint)}
.cate-tab[aria-selected=true] .n{color:var(--gs-green-mid)}

/* ── 主體 ── */
.paper{padding:36px 0 64px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:52px;align-items:start}

.kicker-line{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
  color:var(--gs-green);font-size:12px;font-weight:800;letter-spacing:.12em;
}
.kicker-line::after{content:"";flex:1;height:1px;background:var(--gs-line)}

/* 頭條 */
.lead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:30px;align-items:center;padding-bottom:34px;border-bottom:1px solid var(--gs-line)}
.lead-figure{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--gs-surface-alt);border-radius:2px}
.lead-figure img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lead:hover .lead-figure img{transform:scale(1.03)}
.lead-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lead h2{font-size:clamp(26px,3.2vw,40px);line-height:1.22;letter-spacing:-.035em;font-weight:900;color:var(--gs-ink-strong)}
.lead-excerpt{
  margin-top:15px;color:var(--gs-ink-soft);font-size:15px;line-height:1.95;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.lead-more{display:inline-flex;align-items:center;gap:8px;margin-top:20px;color:var(--gs-green);font-size:14px;font-weight:800}
.lead:hover .lead-more{gap:12px}
.lead-more span{transition:gap .2s ease}

/* 次條三欄 */
.subleads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:32px 0 34px;border-bottom:1px solid var(--gs-line)}
.sublead-figure{aspect-ratio:16/10;overflow:hidden;background:var(--gs-surface-alt);border-radius:2px;margin-bottom:14px}
.sublead-figure img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sublead:hover .sublead-figure img{transform:scale(1.04)}
.sublead h3{margin-top:11px;font-size:18px;line-height:1.5;letter-spacing:-.02em;font-weight:800}
.sublead:hover h3{color:var(--gs-green)}
.sublead-excerpt{
  margin-top:8px;color:var(--gs-muted);font-size:13px;line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* 其餘條目 */
.stories{padding-top:14px}
.story{
  display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;align-items:start;
  padding:22px 0;border-bottom:1px solid var(--gs-line-soft);
  transition:background .2s ease,padding-inline .2s ease;
}
.story:hover{background:rgba(255,255,255,.7);padding-inline:14px}
.story-figure{aspect-ratio:1;overflow:hidden;background:var(--gs-surface-alt);border-radius:2px}
.story-figure img{width:100%;height:100%;object-fit:cover}
.story h3{font-size:17px;line-height:1.55;letter-spacing:-.015em;font-weight:800}
.story:hover h3{color:var(--gs-green)}
.story-excerpt{
  margin-top:7px;color:var(--gs-muted);font-size:13px;line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.story-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}

/* 共用小元件 */
.tag{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:2px;
  font-size:11px;font-weight:800;letter-spacing:.02em;
}
.tag-emergency{background:var(--gs-danger-soft);color:var(--gs-danger)}
.tag-policy{background:var(--gs-info-soft);color:var(--gs-info)}
.tag-news{background:var(--gs-green-soft);color:var(--gs-green)}
.tag-course{background:var(--gs-alt-soft);color:var(--gs-alt)}
.tag-activity{background:var(--gs-warn-soft);color:var(--gs-warn)}
.tag-pin{background:var(--gs-ink);color:#fff}
.dateline{font-family:var(--gs-font-num);font-size:12px;font-weight:600;color:var(--gs-faint);letter-spacing:.02em}
.views{display:inline-flex;align-items:center;gap:4px;font-family:var(--gs-font-num);font-size:12px;color:var(--gs-faint)}
.clickable{cursor:pointer}
.clickable:focus-visible{outline:2px solid var(--gs-green);outline-offset:4px}

/* 側欄 */
.rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:34px}
.rail-block h4{
  padding-bottom:11px;border-bottom:2px solid var(--gs-ink);
  font-size:14px;font-weight:900;letter-spacing:.02em;
}
.rank-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--gs-line-soft);cursor:pointer}
.rank-row:hover .rank-name{color:var(--gs-green)}
.rank-num{
  width:22px;height:22px;display:grid;place-items:center;border-radius:2px;
  background:var(--gs-surface-alt);color:var(--gs-ink-soft);
  font-family:var(--gs-font-num);font-size:12px;font-weight:700;
}
.rank-num.r1{background:var(--gs-green);color:#fff}
.rank-num.r2{background:var(--gs-green-mid);color:#fff}
.rank-num.r3{background:var(--gs-surface-deep);color:var(--gs-green-dark)}
.rank-name{font-size:13px;line-height:1.6;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rail-empty{padding:18px 0;color:var(--gs-faint);font-size:13px}
.rail-links{display:flex;flex-direction:column}
.rail-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--gs-line-soft);font-size:14px;font-weight:700}
.rail-link:hover{color:var(--gs-green)}
.rail-link .arrow{color:var(--gs-green);transition:transform .2s ease}
.rail-link:hover .arrow{transform:translateX(4px)}

/* 骨架與狀態 */
.skel{background:linear-gradient(90deg,var(--gs-line-soft) 25%,var(--gs-surface-alt) 50%,var(--gs-line-soft) 75%);background-size:300% 100%;animation:shimmer 1.5s infinite;border-radius:2px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel-lead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:30px;align-items:center}
.skel-lead .skel-img{aspect-ratio:4/3}
.state{padding:80px 20px;text-align:center;color:var(--gs-muted)}
.state h3{margin-top:16px;font-size:18px;color:var(--gs-ink)}
.state p{margin-top:8px;font-size:14px}
.state svg{margin:0 auto;stroke:var(--gs-line-strong)}

/* 全文彈窗 */
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(28,40,34,.55);display:none;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.open{display:flex}
.modal{width:min(760px,100%);max-height:88vh;background:var(--gs-surface);border-radius:4px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(28,40,34,.28)}
.modal-header{display:flex;align-items:flex-start;gap:16px;padding:26px 28px 18px;border-bottom:1px solid var(--gs-line)}
.modal-title{flex:1;font-size:clamp(21px,2.6vw,29px);line-height:1.35;letter-spacing:-.03em;font-weight:900;color:var(--gs-ink-strong)}
.modal-close{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;color:var(--gs-muted);transition:background .18s ease,color .18s ease}
.modal-close:hover{background:var(--gs-surface-alt);color:var(--gs-ink)}
.modal-scroll{overflow-y:auto;overscroll-behavior:contain}
.modal-body{padding:20px 28px 26px}
.modal-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.modal-content{color:var(--gs-ink);font-size:15.5px;line-height:2.05;overflow-wrap:anywhere}
.modal-content p{margin-bottom:14px}
.modal-content h2,.modal-content h3{margin:22px 0 10px;line-height:1.5}
.modal-content ul,.modal-content ol{margin:0 0 14px 22px}
.modal-content li{margin-bottom:6px}
.modal-content a{color:var(--gs-green);text-decoration:underline;text-underline-offset:3px}
.modal-content blockquote{margin:0 0 14px;padding:12px 16px;border-left:2px solid var(--gs-green);background:var(--gs-green-soft)}
.modal-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:0 28px 28px}
.modal-gallery img{width:100%;border-radius:2px;background:var(--gs-surface-alt)}

@media(max-width:1000px){
  .layout{grid-template-columns:1fr;gap:44px}
  .rail{position:static}
  .rail-block{padding-top:6px}
}
@media(max-width:820px){
  .lead,.skel-lead{grid-template-columns:1fr;gap:18px}
  .lead-figure{aspect-ratio:16/10}
  .subleads{grid-template-columns:1fr;gap:0;padding:8px 0 12px}
  .sublead{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;align-items:start;padding:20px 0;border-bottom:1px solid var(--gs-line-soft)}
  .sublead-figure{aspect-ratio:1;margin-bottom:0}
  .sublead h3{margin-top:0;font-size:17px}
  .sublead-excerpt{-webkit-line-clamp:2}
}
@media(max-width:600px){
  .shell{width:calc(100% - 32px)}
  .masthead-main{padding:24px 0 20px}
  .masthead h1{font-size:38px}
  .masthead-lead{font-size:13px;max-width:none}
  .cate-tabs{gap:18px}
  .cate-tab{font-size:14px;padding:14px 0 11px}
  .paper{padding:26px 0 48px}
  .lead h2{font-size:25px}
  .lead-excerpt{font-size:14px;-webkit-line-clamp:3}
  .story,.sublead{grid-template-columns:88px minmax(0,1fr);gap:14px;padding:18px 0}
  .story:hover,.sublead:hover{padding-inline:0;background:transparent}
  .story h3,.sublead h3{font-size:15.5px}
  .story-excerpt,.sublead-excerpt{font-size:12.5px;-webkit-line-clamp:2}
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal{max-height:92vh;border-radius:4px 4px 0 0}
  .modal-header{padding:20px 20px 14px}
  .modal-body{padding:16px 20px 22px}
  .modal-gallery{padding:0 20px 22px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
