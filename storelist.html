<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

:root{
  --bg:        #F5F2EE;
  --card:      #FFFFFF;
  --border:    #E2D9CF;
  --divider:   #EDE7DF;
  --lbl:       #8C7B6A;
  --val:       #2C2018;
  --muted:     #B8A898;
  --heading:   #1E160E;
  --primary:       #3B82F6;
  --primary-light: #EFF6FF;
  --primary-dark:  #2563EB;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.07);
  --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --radius: 10px;
  --font: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
}

body{ font-family: var(--font); background: var(--bg); color: var(--val); font-size: 15px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ── Login screen ── */
#loginScreen{
  position: fixed; inset: 0; z-index: 500;
  display: none; align-items: center; justify-content: center;
  padding: 28px 16px;
  background:
    radial-gradient(circle at top left, rgba(59,130,246,.10), transparent 34%),
    radial-gradient(circle at bottom right, rgba(37,99,235,.08), transparent 28%),
    var(--bg);
}
.login-card{
  width: min(100%, 420px);
  background: rgba(255,255,255,.92);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 18px 40px rgba(30,22,14,.08);
  padding: 28px 24px;
}
.login-badge{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 12px; border-radius:999px;
  background: var(--primary-light); color: var(--primary-dark);
  font-size: 12px; font-weight: 700; margin-bottom: 16px;
}
.login-title{ font-size: 28px; font-weight: 800; color: var(--heading); margin-bottom: 8px; }
.login-sub{ font-size: 14px; color: var(--lbl); line-height: 1.75; margin-bottom: 20px; }
#loginBtnWrap{ display:flex; justify-content:center; }
.login-error{
  margin-top: 14px; padding: 12px 14px; border-radius: 12px;
  background: #FFF1EF; color: #B95353; font-size: 13px; display: none;
}

/* ── Page header ── */
.page-header{
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 0 16px; height: 54px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.header-title{ flex: 1; font-size: 16px; font-weight: 700; color: var(--heading); text-align: center; }
.header-subtitle{ font-size: 12px; font-weight: 400; color: var(--lbl); margin-top: 1px; }
.stats-toggle-btn{
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: 13px; font-weight: 600; color: var(--lbl);
  transition: all .15s; white-space: nowrap;
}
.stats-toggle-btn:hover{ background: var(--divider); border-color: var(--muted); }
.stats-toggle-btn.active{ background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.apply-btn{
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: 8px; border: none;
  background: var(--primary); font-size: 13px; font-weight: 600; color: #fff;
  transition: background .15s; white-space: nowrap;
}
.apply-btn:hover{ background: var(--primary-dark); }

/* ── Filter bar ── */
.filter-wrap{ background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 54px; z-index: 90; }
.filter-bar{ padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search-wrap{ flex: 1; min-width: 180px; position: relative; display: flex; align-items: center; }
.search-wrap svg{ position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
.search-input{
  width: 100%; padding: 7px 10px 7px 34px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--bg);
  font-family: var(--font); font-size: 13px; color: var(--val); outline: none; transition: border-color .15s;
}
.search-input:focus{ border-color: var(--primary); }
.taxonomy-btn{
  display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:8px;
  border:1px solid var(--border); background:var(--card); color:var(--primary-dark);
  font-size:13px; font-weight:700; white-space:nowrap;
}
.taxonomy-btn:hover{ background:var(--primary-light); border-color:var(--primary); }

/* ── Dropdown ── */
.dropdown{ position: relative; }
.dropdown-btn{
  display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); font-size: 13px; font-weight: 600;
  color: var(--lbl); transition: all .15s; white-space: nowrap;
}
.dropdown-btn:hover{ background: var(--divider); }
.dropdown-btn.active{ background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.dropdown-btn .chevron{ transition: transform .2s; flex-shrink: 0; }
.dropdown-btn.open .chevron{ transform: rotate(180deg); }
.dropdown-panel{
  position: absolute; top: calc(100% + 6px); left: 0;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.13); z-index: 300; min-width: 160px;
  display: none; overflow: hidden;
}
.dropdown-panel.open{ display: block; }
.dropdown-list{ max-height: 230px; overflow-y: auto; padding: 4px 0; }
.dropdown-item{ padding: 8px 14px; font-size: 13px; color: var(--val); cursor: pointer; transition: background .1s; display: flex; align-items: center; gap: 9px; }
.dropdown-item:hover{ background: var(--bg); }
.dropdown-item.selected{ color: var(--primary); font-weight: 700; background: var(--primary-light); }
.item-dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Result summary ── */
.result-bar{ padding: 10px 16px 4px; font-size: 12px; color: var(--lbl); display: flex; align-items: center; gap: 6px; }
.result-bar strong{ color: var(--primary); }

/* ── Card grid ── */
.card-grid{ padding: 4px 12px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

/* ── Store card ── */
.store-card{
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); overflow: hidden; cursor: pointer;
  transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column;
}
.store-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.store-card.status-public  { border-left: 3px solid #2F6836; }
.store-card.status-pending { border-left: 3px solid #B75D00; }
.store-card.status-reject  { border-left: 3px solid #B8A898; }

.card-thumb{ width: 100%; aspect-ratio: 16/9; background: var(--divider); overflow: hidden; flex-shrink: 0; position: relative; }
.card-thumb img{ width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.store-card:hover .card-thumb img{ transform: scale(1.04); }
.card-thumb-placeholder{
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #F0EBE4 0%, #EDE7DF 100%);
}
.no-photo-content{ display: flex; flex-direction: column; align-items: center; gap: 5px; }
.no-photo-emoji{ font-size: 26px; line-height: 1; filter: grayscale(.3); }
.no-photo-text{ font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .3px; }
.thumb-view-badge{
  position: absolute; top: 8px; right: 8px; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 999px;
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(226,217,207,.9);
  color: var(--lbl); font-size: 11px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.thumb-view-badge svg{ width: 12px; height: 12px; opacity: .72; }

.card-body{ padding: 11px 12px 13px; flex: 1; display: flex; flex-direction: column; }
.card-top{ display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.card-id{ font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .4px; }
.card-date{ font-size: 11px; color: var(--muted); font-weight: 500; }
.badge{ display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .2px; }
.badge-pending { background: #FFF3E0; color: #B75D00; }
.badge-public  { background: #EAF3EB; color: #2F6836; }
.badge-reject  { background: #F0EEEC; color: #7A6E66; }
.card-title{ font-size: 14px; font-weight: 700; color: var(--heading); line-height: 1.4; margin-bottom: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-phone{ display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.45; color: var(--lbl); margin-bottom: 7px; }
.card-phone svg{ width: 11px; height: 11px; flex-shrink: 0; }
.card-address{ font-size: 12px; line-height: 1.45; color: var(--lbl); margin-bottom: 7px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta{ display: flex; flex-wrap: wrap; gap: 6px; }
.cate-badge{ display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; }
.brand-tag{ display: inline-flex; align-items: center; font-size: 11px; color: #B75D00; background: #FFF3E0; border: 1px solid #F5D7A2; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
.card-offer-divider{ height: 1px; background: var(--divider); margin-top: 10px; margin-bottom: 8px; }
.card-offer-label{ display: inline-flex; align-items: center; align-self: flex-start; padding: 2px 7px; border-radius: 999px; background: var(--primary-light); color: var(--primary-dark); font-size: 11px; font-weight: 700; margin-bottom: 5px; }
.card-desc{ font-size: 12px; color: var(--lbl); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ── Group header ── */
.group-header{ grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 2px 4px; }
.group-label{ font-size: 12px; font-weight: 700; color: var(--lbl); }
.group-count{ font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--divider); padding: 1px 7px; border-radius: 999px; }
.group-line{ flex: 1; height: 1px; background: var(--divider); }

/* ── State wrap ── */
.state-wrap{ grid-column: 1 / -1; text-align: center; padding: 60px 24px; color: var(--lbl); }
.state-wrap svg{ margin: 0 auto 16px; opacity: .4; }
.state-wrap h3{ font-size: 16px; color: var(--heading); margin-bottom: 6px; }
.state-wrap p{ font-size: 13px; }

/* ── Stats sidebar ── */
.sidebar-backdrop{
  position: fixed; inset: 0; background: rgba(30,22,14,.24);
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 210;
}
.sidebar-backdrop.open{ opacity: 1; pointer-events: auto; }
.stats-sidebar{
  position: fixed; top: 0; left: 0; height: 100vh; width: 320px; max-width: calc(100vw - 24px);
  background: var(--card); border-right: 1px solid var(--border); box-shadow: 6px 0 24px rgba(0,0,0,.12);
  transform: translateX(-100%); transition: transform .22s ease; z-index: 220; display: flex; flex-direction: column;
}
.stats-sidebar.open{ transform: translateX(0); }
.sidebar-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 16px 12px; border-bottom:1px solid var(--divider);
}
.sidebar-header h2{ font-size:18px; color:var(--heading); }
.sidebar-close{
  width:30px; height:30px; border:none; border-radius:999px; background:var(--bg); color:var(--lbl); font-size:22px; line-height:1;
}
.sidebar-body{ padding:14px 16px 18px; overflow-y:auto; }
.stats-grid{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:16px;
}
.stats-box{
  padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--bg);
}
.stats-box-label{ font-size:12px; color:var(--lbl); margin-bottom:6px; font-weight:700; }
.stats-box-value{ font-size:24px; font-weight:800; color:var(--heading); }
.stats-box-note{ font-size:11px; color:var(--muted); margin-top:4px; }
.stat-section{ margin-top:16px; }
.stat-section:first-child{ margin-top:0; }
.stat-title{ font-size:12px; font-weight:700; color:var(--lbl); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px; }
.stat-list{ display:flex; flex-direction:column; gap:8px; }
.stat-row{ display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; font-size:12px; color:var(--val); }
.stat-dot{ width:8px; height:8px; border-radius:999px; }
.stat-track{ height:7px; border-radius:999px; background:var(--divider); overflow:hidden; }
.stat-fill{ height:100%; border-radius:999px; background:var(--primary); }
.chart-section{ margin-top:16px; }
.chart-title{ font-size:12px; font-weight:700; color:var(--lbl); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px; }
.chart-wrap{ position:relative; width:100%; height:200px; }

/* ── Skeleton ── */
.skel{ background: linear-gradient(90deg,var(--divider) 25%,#ece6de 50%,var(--divider) 75%); background-size: 300% 100%; animation: shimmer 1.4s infinite; border-radius: 5px; }
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{ background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }

/* ── Sortable group ── */
.group-cards{ grid-column: 1/-1; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.sortable-ghost{ opacity: .4; }
.sortable-drag{ box-shadow: 0 8px 24px rgba(0,0,0,.18) !important; }

/* ── 刪除按鈕 ── */
.del-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); transition: all .15s;
  cursor: pointer; flex-shrink: 0; padding: 0; margin-left: auto;
}
.del-btn svg { width: 13px; height: 13px; display: block; }
.del-btn:hover { background: #FFF1F1; border-color: #E57373; color: #C62828; }

/* ── taxonomy manager ── */
.taxonomy-overlay{
  position:fixed; inset:0; z-index:420; display:none; align-items:center; justify-content:center;
  padding:18px; background:rgba(30,22,14,.42);
}
.taxonomy-overlay.open{ display:flex; }
.taxonomy-modal{
  width:min(100%,620px); max-height:min(88vh,760px); overflow:hidden;
  display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border);
  border-radius:16px; box-shadow:0 18px 48px rgba(30,22,14,.18);
}
.taxonomy-head,.taxonomy-foot{ display:flex; align-items:center; gap:10px; padding:14px 16px; }
.taxonomy-head{ border-bottom:1px solid var(--divider); }
.taxonomy-head h2{ flex:1; font-size:16px; color:var(--heading); }
.taxonomy-close{
  width:30px; height:30px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--lbl); font-size:18px; line-height:1;
}
.taxonomy-body{ overflow:auto; padding:16px; display:grid; gap:16px; }
.taxonomy-section{ display:grid; gap:9px; }
.taxonomy-label{ font-size:13px; font-weight:700; color:var(--heading); }
.taxonomy-note{ font-size:12px; line-height:1.55; color:var(--lbl); }
.taxonomy-input-row{ display:flex; gap:8px; }
.taxonomy-input-row input{
  flex:1; min-width:0; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--val); font:inherit; padding:9px 11px; outline:none;
}
.taxonomy-input-row input:focus{ border-color:var(--primary); }
.taxonomy-add,.taxonomy-save,.taxonomy-cancel{
  border-radius:8px; padding:8px 12px; font:inherit; font-size:13px; font-weight:700;
}
.taxonomy-add,.taxonomy-save{ border:0; background:var(--primary); color:#fff; }
.taxonomy-add:hover,.taxonomy-save:hover{ background:var(--primary-dark); }
.taxonomy-cancel{ border:1px solid var(--border); background:var(--bg); color:var(--lbl); }
.taxonomy-values{ display:flex; flex-wrap:wrap; gap:7px; min-height:34px; }
.taxonomy-chip{
  display:inline-flex; align-items:center; gap:5px; padding:6px 9px;
  border:1px solid var(--border); border-radius:999px; background:var(--bg);
  color:var(--val); font-size:12px; font-weight:700;
}
.taxonomy-chip button{
  width:16px; height:16px; border:0; border-radius:50%; background:var(--divider);
  color:var(--lbl); line-height:1; font-size:12px;
}
.taxonomy-empty{ color:var(--muted); font-size:12px; padding:7px 2px; }
.taxonomy-tag-editor{ display:grid; gap:8px; width:100%; }
.taxonomy-tag-row{
  display:grid; grid-template-columns:minmax(120px,1fr) auto auto; gap:8px; align-items:center;
  padding:9px; border:1px solid var(--divider); border-radius:10px; background:var(--bg);
}
.taxonomy-tag-row input{
  width:100%; min-width:0; border:1px solid var(--border); border-radius:8px;
  background:#fff; color:var(--val); font:inherit; padding:8px 10px;
}
.taxonomy-swatches{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.taxonomy-swatch{
  width:20px; height:20px; border:2px solid transparent; border-radius:50%;
  box-shadow:0 0 0 1px var(--border); padding:0;
}
.taxonomy-swatch.selected{ border-color:var(--heading); }
.taxonomy-swatch[data-color="gold"]{ background:#F7D68D; }
.taxonomy-swatch[data-color="mint"]{ background:#BFE4C5; }
.taxonomy-swatch[data-color="blue"]{ background:#BED7FF; }
.taxonomy-swatch[data-color="rose"]{ background:#F7C1CF; }
.taxonomy-swatch[data-color="violet"]{ background:#DCCBFF; }
.taxonomy-swatch[data-color="stone"]{ background:#D8D0C8; }
.taxonomy-remove-tag{
  width:28px; height:28px; border:1px solid var(--border); border-radius:8px;
  background:#fff; color:var(--lbl); font-size:16px; line-height:1;
}
.taxonomy-foot{ justify-content:flex-end; border-top:1px solid var(--divider); }

/* ── RWD ── */
@media(max-width: 480px){
  .card-grid{ grid-template-columns: 1fr; padding: 4px 10px 80px; }
  .stats-sidebar{ width:100%; max-width:100%; border-right:none; }
  .group-cards{ grid-template-columns: 1fr; }
}

/* ── Multi-select / bulk status ── */
.select-mode-btn{
  display:flex; align-items:center; gap:5px; padding:7px 13px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg);
  font-size:13px; font-weight:600; color:var(--lbl); transition:all .15s; white-space:nowrap;
}
.select-mode-btn:hover{ background:var(--divider); border-color:var(--muted); }
.select-mode-btn.active{ background:#FFF3E0; border-color:#B75D00; color:#B75D00; }
.store-card.selected{ outline:2px solid var(--primary); outline-offset:-2px; }
.store-card.selected .card-thumb::after{
  content:''; position:absolute; inset:0; background:rgba(59,130,246,.12); pointer-events:none;
}
.card-check{
  position:absolute; top:8px; left:8px; z-index:5; width:22px; height:22px;
  border-radius:6px; background:rgba(255,255,255,.95); border:2px solid rgba(180,170,160,.7);
  display:none; align-items:center; justify-content:center; transition:all .15s;
}
.select-mode .card-check{ display:flex; }
.store-card.selected .card-check{ background:var(--primary); border-color:var(--primary); }
.card-check-icon{ display:none; width:13px; height:13px; stroke:#fff; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.store-card.selected .card-check-icon{ display:block; }
.bulk-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:var(--card); border-top:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  box-shadow:0 -4px 20px rgba(0,0,0,.09);
  transform:translateY(100%); transition:transform .22s ease;
}
.bulk-bar.visible{ transform:translateY(0); }
.bulk-count{ font-size:14px; font-weight:700; color:var(--heading); flex:1; min-width:80px; }
.bulk-sel-all{ font-size:13px; color:var(--primary); font-weight:600; cursor:pointer; white-space:nowrap; user-select:none; }
.bulk-sel-all:hover{ text-decoration:underline; }
.bulk-status-sel{
  padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg); font-family:var(--font); font-size:13px; color:var(--val); outline:none; cursor:pointer;
}
.bulk-apply-btn{
  padding:8px 18px; border-radius:8px; border:none;
  background:var(--primary); color:#fff; font-family:var(--font);
  font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; transition:background .15s;
}
.bulk-apply-btn:hover:not(:disabled){ background:var(--primary-dark); }
.bulk-apply-btn:disabled{ opacity:.45; cursor:not-allowed; }
.bulk-cancel-btn{
  padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  background:transparent; font-family:var(--font); font-size:13px; color:var(--lbl); cursor:pointer;
}
.bulk-cancel-btn:hover{ background:var(--bg); }
/* Toast */
.toast-wrap{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
.toast-msg{
  background:#1e2a38; color:#fff; padding:10px 18px; border-radius:10px;
  font-size:13px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.22);
  animation:toastIn .2s ease, toastOut .3s ease 2.5s forwards;
  white-space:nowrap;
}
@keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastOut{ to{opacity:0;transform:translateY(-6px)} }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-badge">美食地圖管理入口</div>
    <div class="login-title">商店管理</div>
    <div class="login-sub">請使用已授權的 Google 帳號登入後，直接在這裡管理美食地圖商家資料。</div>
    <div id="loginBtnWrap"></div>
    <div class="login-error" id="loginError">此帳號沒有管理員權限，請聯絡系統管理員。</div>
  </div>
</div>

<div id="appShell" style="display:none">
<div class="sidebar-backdrop" id="backdrop" onclick="closeSidebar()"></div>

<div class="stats-sidebar" id="statsSidebar">
  <div class="sidebar-header">
    <h2>📊 商店統計</h2>
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="關閉">&#215;</button>
  </div>
  <div class="sidebar-body" id="sidebarBody">
    <div style="text-align:center;padding:40px 0;color:var(--muted);font-size:13px">載入中…</div>
  </div>
</div>

<div class="page-header">
  <button class="stats-toggle-btn" id="statsToggleBtn" onclick="toggleSidebar()">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    統計
  </button>
  <div class="header-title">
    <div>美食地圖清單</div>
    <div class="header-subtitle" id="headerSubtitle">舊社里・里民小幫手</div>
  </div>
  <button class="taxonomy-btn" type="button" onclick="openTaxonomyModal()">
    管理類別與標籤
  </button>
  <button class="select-mode-btn" id="selectModeBtn" onclick="toggleSelectMode()" title="多選批次改狀態">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7M17.5 14v7"/></svg>
    多選
  </button>
  <button class="apply-btn" onclick="window.location.href='store.html'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    申請
  </button>
</div>

<div class="filter-wrap">
<div class="filter-bar">

  <!-- Status dropdown -->
  <div class="dropdown" id="statusDropdown">
    <button class="dropdown-btn" id="statusBtn" onclick="toggleDropdown('statusDropdown')">
      <span id="statusLabel">商店狀態</span>
      <svg class="chevron" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-panel" id="statusPanel">
      <div class="dropdown-list" id="statusList">
        <div class="dropdown-item selected" data-value="all"   onclick="selectStatus(this)"><span class="item-dot" style="background:#B8A898"></span>全部狀態</div>
        <div class="dropdown-item" data-value="申請審核中"        onclick="selectStatus(this)"><span class="item-dot" style="background:#B75D00"></span>申請審核中</div>
        <div class="dropdown-item" data-value="已公開"          onclick="selectStatus(this)"><span class="item-dot" style="background:#2F6836"></span>已公開</div>
        <div class="dropdown-item" data-value="不通過"          onclick="selectStatus(this)"><span class="item-dot" style="background:#7A6E66"></span>不通過</div>
      </div>
    </div>
  </div>

  <!-- Category dropdown -->
  <div class="dropdown" id="categoryDropdown">
    <button class="dropdown-btn" id="categoryBtn" onclick="toggleDropdown('categoryDropdown')">
      <span id="categoryLabel">商家類別</span>
      <svg class="chevron" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-panel" id="categoryPanel">
      <div class="dropdown-list" id="categoryList">
        <div class="dropdown-item selected" data-value="all" onclick="selectCategory(this)">全部類別</div>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="搜尋…" oninput="applyFilters()">
  </div>

</div>
</div>

<div class="result-bar" id="resultBar">載入中…</div>

<div class="card-grid" id="cardGrid">
  <div class="skel-card" style="height:220px"><div class="skel" style="height:130px;border-radius:0"></div><div style="padding:12px 14px"><div class="skel" style="height:12px;width:50%;margin-bottom:8px"></div><div class="skel" style="height:15px;width:85%;margin-bottom:6px"></div><div class="skel" style="height:12px;width:65%"></div></div></div>
  <div class="skel-card" style="height:220px"><div class="skel" style="height:130px;border-radius:0"></div><div style="padding:12px 14px"><div class="skel" style="height:12px;width:40%;margin-bottom:8px"></div><div class="skel" style="height:15px;width:90%;margin-bottom:6px"></div><div class="skel" style="height:12px;width:70%"></div></div></div>
  <div class="skel-card" style="height:220px"><div class="skel" style="height:130px;border-radius:0"></div><div style="padding:12px 14px"><div class="skel" style="height:12px;width:55%;margin-bottom:8px"></div><div class="skel" style="height:15px;width:75%;margin-bottom:6px"></div><div class="skel" style="height:12px;width:60%"></div></div></div>
</div>

<div class="taxonomy-overlay" id="taxonomyOverlay" onclick="if(event.target===this)closeTaxonomyModal()">
  <div class="taxonomy-modal" role="dialog" aria-modal="true" aria-labelledby="taxonomyTitle">
    <div class="taxonomy-head">
      <h2 id="taxonomyTitle">管理類別與標籤</h2>
      <button class="taxonomy-close" type="button" onclick="closeTaxonomyModal()" aria-label="關閉">&#215;</button>
    </div>
    <div class="taxonomy-body">
      <div class="taxonomy-section">
        <div class="taxonomy-label">商家類別</div>
        <div class="taxonomy-input-row">
          <input type="text" id="taxonomyCategoryInput" maxlength="18" placeholder="新增類別">
          <button class="taxonomy-add" type="button" onclick="addTaxonomyValue('categories')">新增</button>
        </div>
        <div class="taxonomy-values" id="taxonomyCategories"></div>
      </div>
      <div class="taxonomy-section">
        <div class="taxonomy-label">品牌標籤</div>
        <div class="taxonomy-input-row">
          <input type="text" id="taxonomyBrandTagInput" maxlength="6" placeholder="新增核可標籤">
          <button class="taxonomy-add" type="button" onclick="addTaxonomyValue('brandTags')">新增</button>
        </div>
        <div class="taxonomy-values" id="taxonomyBrandTags"></div>
        <div class="taxonomy-note">這裡會一起顯示已公開店家用過的標籤；有 &#215; 的是管理員直接核可標籤，可在這裡移除。</div>
      </div>
    </div>
    <div class="taxonomy-foot">
      <button class="taxonomy-cancel" type="button" onclick="closeTaxonomyModal()">取消</button>
      <button class="taxonomy-save" id="taxonomySaveBtn" type="button" onclick="saveTaxonomy()">儲存</button>
    </div>
  </div>
</div>
</div>

<!-- ── Bulk action bar ── -->
<div class="bulk-bar" id="bulkBar">
  <div class="bulk-count" id="bulkCount">已選 0 間</div>
  <span class="bulk-sel-all" id="bulkSelAllBtn" onclick="bulkSelectAll()">全選</span>
  <select class="bulk-status-sel" id="bulkStatusSel" onchange="updateBulkBar()">
    <option value="">選擇狀態…</option>
    <option value="已公開">✅ 已公開</option>
    <option value="申請審核中">🕐 申請審核中</option>
    <option value="不通過">❌ 不通過</option>
  </select>
  <button class="bulk-apply-btn" id="bulkApplyBtn" onclick="applyBulkStatus()" disabled>套用</button>
  <button class="bulk-cancel-btn" onclick="toggleSelectMode()">取消</button>
</div>
<!-- Toast container -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="storeconfig.js"></script>
<script src="utils.js"></script>
<script src="./shared/storelist.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
