<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

:root{
  --bg:        #EFF8F2;
  --card:      #FFFFFF;
  --border:    #BDD9CA;
  --divider:   #D0E8DA;
  --lbl:       #4E7260;
  --val:       #1A3028;
  --muted:     #86B09E;
  --heading:   #112620;
  --primary:       #5B9B7B;
  --primary-light: #E6F1EA;
  --primary-dark:  #4A8366;
  --shadow-sm: 0 1px 3px rgba(30,80,55,.07);
  --shadow-md: 0 2px 8px rgba(30,80,55,.09), 0 1px 2px rgba(30,80,55,.05);
  --radius:    10px;
  --font: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
}

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--val);
  font-size: 15px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ── */
.page-header{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 50;
}
.back-btn{
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 14px; color: var(--lbl);
  transition: background .15s;
}
.back-btn:hover{ background: var(--bg); }
.page-title{
  font-size: 16px; font-weight: 700;
  color: var(--heading); flex: 1;
  text-align: center;
}
.report-btn{
  display: flex; align-items: center; gap: 5px;
  padding: 6px 13px;
  border-radius: 8px;
  border: none;
  background: #F08080;
  font-size: 13px; font-weight: 600;
  color: #fff;
  transition: background .15s;
}
.report-btn:hover{ background: #D85C5C; }

/* ── Container ── */
.container{
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}

/* ── Card ── */
.card{
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  overflow: hidden;
}
.card-header{
  padding: 14px 18px;
  border-bottom: 1px solid var(--divider);
  font-size: 13px; font-weight: 700;
  color: var(--lbl);
  display: flex; align-items: center; gap: 8px;
  text-transform: uppercase; letter-spacing: .4px;
}

/* ── Title card ── */
.case-title-card{
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px 20px;
  margin-bottom: 14px;
  border-left: 4px solid var(--primary);
}
.case-meta{
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.case-main-title{
  font-size: 18px; font-weight: 700;
  color: var(--heading); line-height: 1.4;
}

/* ── Info table ── */
.info-table{ padding: 4px 0; }
.info-row{
  display: flex;
  padding: 10px 18px;
  border-bottom: 1px solid var(--divider);
  gap: 12px;
}
.info-row:last-child{ border-bottom: none; }
.info-lbl{
  width: 80px; flex-shrink: 0;
  font-size: 12px; font-weight: 600;
  color: var(--lbl);
  padding-top: 1px;
}
.info-val{
  flex: 1; font-size: 14px;
  color: var(--val); line-height: 1.55;
}
.empty{ color: var(--muted); }
.desc{ white-space: pre-wrap; line-height: 1.7; }

/* ── Photo grid ── */
.photo-grid-wrap{ padding: 12px 18px 14px; }
.photo-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.photo-grid img{
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--border);
  cursor: pointer; transition: transform .2s;
}
.photo-grid img:hover{ transform: scale(1.03); }

/* ── Lightbox ── */
.lightbox{
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 999;
  display: none; align-items: center; justify-content: center;
}
.lightbox.open{ display: flex; }
.lightbox img{
  max-width: 95vw; max-height: 90vh;
  border-radius: 6px; object-fit: contain;
}
.lb-close{
  position: absolute; top: 16px; right: 20px;
  color: #fff; font-size: 28px; cursor: pointer;
  background: none; border: none; line-height: 1;
}
.lb-prev, .lb-next{
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.18); border: none; color: #fff;
  font-size: 26px; width: 44px; height: 44px;
  border-radius: 50%; cursor: pointer; line-height: 1;
  display: none; align-items: center; justify-content: center;
  z-index: 1001; transition: background .15s;
}
.lb-prev{ left: 14px; }
.lb-next{ right: 14px; }
.lb-prev:hover,.lb-next:hover{ background: rgba(255,255,255,.32); }
.lb-counter{
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.9); font-size: 13px;
  background: rgba(0,0,0,.45); padding: 4px 14px; border-radius: 20px;
  display: none; pointer-events: none;
}

/* ── Error/Loading ── */
.state-wrap{
  text-align: center; padding: 80px 24px;
  color: var(--lbl);
}
.state-wrap svg{ margin: 0 auto 16px; opacity: .4; }
.state-wrap h3{ font-size: 18px; color: var(--heading); margin-bottom: 8px; }
.state-wrap p{ font-size: 14px; }

@media(max-width:520px){
  .photo-grid{ grid-template-columns: repeat(2, 1fr); }
  .info-lbl{ width: 68px; }
}
</style>
</head>
<body>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">&#215;</button>
  <button class="lb-prev" id="lbPrevBtn">&#10094;</button>
  <img id="lbImg" src="" alt="" onclick="closeLb()">
  <button class="lb-next" id="lbNextBtn">&#10095;</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<!-- ── Page header ── -->
<div class="page-header">
  <button class="back-btn" onclick="goBack()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </button>
  <div class="page-title" id="pageTitle">公開案件詳情</div>
  <button class="report-btn" onclick="window.location.href='report.html'">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    通報
  </button>
</div>

<!-- ── Main content ── -->
<div class="container">
  <div id="mainContent">
    <div class="state-wrap">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <h3>載入中…</h3>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="./shared/opendetail.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
