<style>
/* 活動頁沿用里刊新聞版面，這裡只加活動專屬的元素 */
.tag-open{background:var(--gs-green-soft);color:var(--gs-green)}
.tag-closed{background:var(--gs-neutral-soft);color:var(--gs-neutral)}
.tag-full{background:var(--gs-danger-soft);color:var(--gs-danger)}

.evt-lines{display:flex;flex-direction:column;gap:6px;margin-top:13px}
.evt-line{display:flex;align-items:flex-start;gap:8px;color:var(--gs-ink-soft);font-size:13.5px;line-height:1.65}
.evt-line svg{flex-shrink:0;margin-top:3px;color:var(--gs-faint)}
.evt-line b{font-weight:700;color:var(--gs-ink)}
.story .evt-lines,.sublead .evt-lines{margin-top:9px;gap:4px}
.story .evt-line,.sublead .evt-line{font-size:12.5px;color:var(--gs-muted)}

.evt-quota{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:700;color:var(--gs-ink-soft)}
.evt-quota .num{font-family:var(--gs-font-num);font-size:16px;color:var(--gs-green)}
.evt-quota.full .num{color:var(--gs-danger)}
.quota-bar{width:118px;height:5px;overflow:hidden;background:var(--gs-line);border-radius:var(--gs-radius-pill)}
.quota-fill{height:100%;background:var(--gs-green);border-radius:inherit}
.evt-quota.full .quota-fill{background:var(--gs-danger)}
.story .evt-quota,.sublead .evt-quota{margin-top:9px;font-size:12px}
.story .evt-quota .num,.sublead .evt-quota .num{font-size:14px}

.evt-cta{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;margin-top:20px;padding:0 22px;border-radius:var(--gs-radius-sm);
  background:var(--gs-green);color:#fff;font-size:15px;font-weight:800;
  transition:background .18s ease,transform .18s ease;
}
.evt-cta:hover{background:var(--gs-green-dark);transform:translateY(-1px)}
.evt-cta.disabled{background:var(--gs-neutral-soft);color:var(--gs-neutral);pointer-events:none}
.evt-note{margin-top:10px;color:var(--gs-muted);font-size:12.5px;line-height:1.7}

/* 彈窗裡的活動資訊表 */
.evt-facts{
  display:grid;grid-template-columns:88px minmax(0,1fr);gap:11px 16px;
  margin:18px 0 22px;padding:18px 20px;
  background:var(--gs-surface-alt);border-left:2px solid var(--gs-green);
}
.evt-facts dt{color:var(--gs-muted);font-size:12.5px;font-weight:700;line-height:1.7}
.evt-facts dd{margin:0;font-size:13.5px;line-height:1.7;overflow-wrap:anywhere}
.evt-facts dd a{color:var(--gs-green);text-decoration:underline;text-underline-offset:3px}
.evt-facts dd .num{font-family:var(--gs-font-num);font-weight:700}
@media(max-width:600px){
  .evt-facts{grid-template-columns:76px minmax(0,1fr);gap:9px 12px;padding:15px 16px}
  .evt-facts dt{font-size:12px}
  .evt-facts dd{font-size:13px}
  .evt-cta{width:100%;min-height:46px;margin-top:16px}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="shell">
    <div class="masthead-top">
      <a class="back-home" href="./index.html">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        回首頁
      </a>
      <span class="masthead-stat" id="eventCount" hidden></span>
    </div>
    <div class="masthead-main">
      <div>
        <div class="masthead-kicker" id="mastheadKicker">舊社里 里民小幫手</div>
        <h1>里民活動</h1>
      </div>
      <p class="masthead-lead">里辦舉辦的活動、課程與講座。報名請透過官方 LINE，名額有限額滿為止。<br><span class="dateline" id="todayLine"></span></p>
    </div>
  </div>
</header>

<nav class="cate-nav">
  <div class="shell">
    <div class="cate-tabs" id="cateTabs" role="tablist" aria-label="活動狀態"></div>
  </div>
</nav>

<main class="paper">
  <div class="shell layout">
    <div>
      <div id="feed">
        <div class="skel-lead">
          <div class="skel skel-img"></div>
          <div>
            <div class="skel" style="height:13px;width:34%;margin-bottom:16px"></div>
            <div class="skel" style="height:30px;width:92%;margin-bottom:10px"></div>
            <div class="skel" style="height:30px;width:64%;margin-bottom:20px"></div>
            <div class="skel" style="height:12px;width:100%;margin-bottom:9px"></div>
            <div class="skel" style="height:12px;width:88%"></div>
          </div>
        </div>
      </div>
    </div>

    <aside class="rail">
      <div class="rail-block">
        <h4>怎麼報名</h4>
        <p class="rail-empty" style="line-height:1.85">加入舊社里官方 LINE，輸入「<strong>我要報名</strong>」就會列出開放中的活動，跟著步驟填完資料即可。想確認自己報過沒有，輸入「查詢報名」。</p>
        <a class="evt-cta" id="railCta" href="#" target="_blank" rel="noopener" style="margin-top:6px;width:100%">
          <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 2.7 1.5 5.1 3.86 6.66-.1.36-.6 2.1-.68 2.43 0 0-.02.11.06.16.07.04.16.01.16.01.22-.03 2.5-1.64 3.49-2.3.99.15 2.02.24 3.11.24 5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
        開啟官方 LINE
        </a>
      </div>
      <div class="rail-block">
        <h4>其他服務</h4>
        <div class="rail-links">
          <a class="rail-link" href="./bulletin.html">里刊公佈欄<span class="arrow">→</span></a>
          <a class="rail-link" href="./report.html">案件通報<span class="arrow">→</span></a>
          <a class="rail-link" href="./storeopenlist.html">舊社商圈<span class="arrow">→</span></a>
        </div>
      </div>
    </aside>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModalDirect()" aria-label="關閉">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-scroll">
      <div class="modal-body">
        <div class="modal-meta" id="modalMeta"></div>
        <dl class="evt-facts" id="modalFacts"></dl>
        <div class="modal-content" id="modalContent"></div>
        <div id="modalCta"></div>
      </div>
      <div class="modal-gallery" id="modalGallery" hidden></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="./assets/eventopenlist.js?v=20260910-fix1"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
