<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

:root{
  --bg:        #EDF5FF;
  --card:      #FFFFFF;
  --border:    #B8D4EE;
  --divider:   #CCE2F5;
  --lbl:       #456280;
  --val:       #182C44;
  --muted:     #80AACB;
  --heading:   #0E2038;
  --primary:       #4A92C4;
  --primary-light: #E3F2FF;
  --primary-dark:  #3070A0;
  --shadow-sm: 0 1px 3px rgba(20,60,100,.07);
  --shadow-md: 0 2px 8px rgba(20,60,100,.09), 0 1px 2px rgba(20,60,100,.05);
  --radius:    10px;
  --font: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
}

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--val);
  font-size: 15px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ── */
.page-header{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 50;
}
.back-btn{
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 14px; color: var(--lbl);
  transition: background .15s;
}
.back-btn:hover{ background: var(--bg); }
.page-title{
  font-size: 16px; font-weight: 700;
  color: var(--heading); flex: 1;
  text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* ── Container ── */
.container{
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}

/* ── Hero image ── */
.hero-placeholder{
  width: 100%; aspect-ratio: 16/9;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, #DCEEFF 0%, #C8E2F8 100%);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}

/* ── Carousel ── */
.carousel-wrap{
  position: relative;
  width: 100%;
  height: min(80vw, 500px);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 14px;
  overflow: hidden;
  background: #111;
  user-select: none;
}
.carousel-track{
  display: flex;
  width: 100%; height: 100%;
  transition: transform .3s ease;
}
.carousel-slide{
  flex: 0 0 100%; height: 100%;
  cursor: zoom-in;
  display: flex;
  align-items: center;
  justify-content: center;
}
.carousel-slide img{
  max-width: 100%; max-height: 100%;
  width: auto; height: auto;
  object-fit: contain;
  display: block;
}
.carousel-btn{
  position: absolute; top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,.45);
  border: none; color: #fff;
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; line-height: 1;
  cursor: pointer; z-index: 5;
  transition: background .15s;
}
.carousel-btn:hover{ background: rgba(0,0,0,.7); }
.carousel-btn.prev{ left: 10px; }
.carousel-btn.next{ right: 10px; }
.carousel-dots{
  position: absolute; bottom: 10px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 5;
}
.carousel-dot{
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,.45);
  cursor: pointer;
  transition: background .2s;
}
.carousel-dot.active{ background: #fff; }

/* ── Title card ── */
.title-card{
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px 20px;
  margin-bottom: 14px;
  border-left: 4px solid var(--primary);
}
.title-meta{
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.cate-badge{
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 5px;
  font-size: 12px; font-weight: 700;
}
.store-name{
  font-size: 20px; font-weight: 700;
  color: var(--heading); line-height: 1.35;
  margin-bottom: 6px;
}
.store-phone-hero{
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 600;
  color: var(--primary); margin-top: 4px;
}
.store-phone-hero a{
  color: var(--primary); text-decoration: none;
}
.store-phone-hero a:hover{ text-decoration: underline; }

/* ── Card ── */
.card{
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  overflow: hidden;
}
.card-header{
  padding: 14px 18px;
  border-bottom: 1px solid var(--divider);
  font-size: 13px; font-weight: 700;
  color: var(--lbl);
  display: flex; align-items: center; gap: 8px;
  text-transform: uppercase; letter-spacing: .4px;
}

/* ── Info table ── */
.info-table{ padding: 4px 0; }
.info-row{
  display: flex;
  padding: 11px 18px;
  border-bottom: 1px solid var(--divider);
  gap: 12px;
}
.info-row:last-child{ border-bottom: none; }
.info-lbl{
  width: 80px; flex-shrink: 0;
  font-size: 12px; font-weight: 600;
  color: var(--lbl); padding-top: 2px;
}
.info-val{
  flex: 1; font-size: 14px;
  color: var(--val); line-height: 1.6;
  word-break: break-word;
}
.info-val a{ color: var(--primary); text-decoration: none; }
.info-val a:hover{ text-decoration: underline; }
.paragraph-list{ display:flex; flex-direction:column; gap:7px; }
.paragraph-list p{ margin:0; line-height:1.7; }

/* ── Offer highlight ── */
.offer-box{
  margin: 0 18px 14px;
  padding: 12px 14px;
  background: var(--primary-light);
  border-radius: 8px;
  border-left: 3px solid var(--primary);
  font-size: 13px; color: var(--primary-dark);
  line-height: 1.6; white-space: pre-wrap;
}

/* ── Lightbox ── */
.lightbox{
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 999;
  display: none; align-items: center; justify-content: center;
}
.lightbox.open{ display: flex; }
.lightbox img{
  max-width: 95vw; max-height: 90vh;
  border-radius: 6px; object-fit: contain;
}
.lb-close{
  position: absolute; top: 16px; right: 20px;
  color: #fff; font-size: 28px; cursor: pointer;
  background: none; border: none; line-height: 1;
}
.lb-prev, .lb-next{
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.18); border: none; color: #fff;
  font-size: 26px; width: 44px; height: 44px;
  border-radius: 50%; cursor: pointer; line-height: 1;
  display: none; align-items: center; justify-content: center;
  z-index: 1001; transition: background .15s;
}
.lb-prev{ left: 14px; }
.lb-next{ right: 14px; }
.lb-prev:hover,.lb-next:hover{ background: rgba(255,255,255,.32); }
.lb-counter{
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.9); font-size: 13px;
  background: rgba(0,0,0,.45); padding: 4px 14px; border-radius: 20px;
  display: none; pointer-events: none;
}

/* ── Error/Loading ── */
.state-wrap{
  text-align: center; padding: 80px 24px;
  color: var(--lbl);
}
.state-wrap svg{ margin: 0 auto 16px; opacity: .4; }
.state-wrap h3{ font-size: 18px; color: var(--heading); margin-bottom: 8px; }
.state-wrap p{ font-size: 14px; }

@media(max-width:520px){
  .info-lbl{ width: 66px; }
}
</style>
</head>
<body>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">&#215;</button>
  <button class="lb-prev" id="lbPrevBtn">&#10094;</button>
  <img id="lbImg" src="" alt="" onclick="closeLb()">
  <button class="lb-next" id="lbNextBtn">&#10095;</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<!-- ── Page header ── -->
<div class="page-header">
  <button class="back-btn" onclick="window.location.href='storeopenlist.html'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回商家列表
  </button>
  <div class="page-title" id="pageTitle">商店詳情</div>
</div>

<!-- ── Main content ── -->
<div class="container">
  <div id="mainContent">
    <div class="state-wrap">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <h3>載入中…</h3>
    </div>
  </div>
</div>

<script src="storeconfig.js"></script>
<script src="utils.js"></script>
<script src="./shared/storeopendetail.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
