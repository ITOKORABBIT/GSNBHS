<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<style>
/* ── Reset & Tokens ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

:root{
  --bg:        #F5F2EE;
  --card:      #FFFFFF;
  --border:    #E2D9CF;
  --divider:   #EDE7DF;
  --lbl:       #8C7B6A;
  --val:       #2C2018;
  --muted:     #B8A898;
  --heading:   #1E160E;

  --primary:       #4B7A52;
  --primary-light: #EAF3EB;
  --primary-dark:  #3A5E3F;

  --badge-new-bg:   #EBF3FF; --badge-new-txt:  #1A56A8;
  --badge-proc-bg:  #FFF3E0; --badge-proc-txt: #B75D00;
  --badge-done-bg:  #EAF3EB; --badge-done-txt: #2F6836;
  --badge-fwd-bg:   #F3EBFF; --badge-fwd-txt:  #6B28A8;
  --badge-grey-bg:  #F0EEEC; --badge-grey-txt: #7A6E66;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.07);
  --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --radius: 10px;
  --font: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;

  --sidebar-w: 300px;
}

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--val);
  font-size: 15px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ── */
.page-header{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 54px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.header-title{
  flex: 1;
  font-size: 16px; font-weight: 700;
  color: var(--heading);
  text-align: center;
}
.header-subtitle{
  font-size: 12px; font-weight: 400;
  color: var(--lbl); margin-top: 1px;
}
.stats-toggle-btn{
  display: flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 13px; font-weight: 600;
  color: var(--lbl);
  transition: all .15s;
  white-space: nowrap;
}
.stats-toggle-btn:hover{ background: var(--divider); border-color: var(--muted); }
.stats-toggle-btn.active{
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}
.report-btn{
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px;
  border-radius: 8px;
  border: none;
  background: var(--primary);
  font-size: 13px; font-weight: 600;
  color: #fff;
  transition: background .15s;
  white-space: nowrap;
}
.report-btn:hover{ background: var(--primary-dark); }

/* ── Filter bar ── */
.filter-wrap{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 54px; z-index: 90;
}
.filter-bar{
  padding: 8px 16px;
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap;
}
.filter-bar + .filter-bar{
  border-top: 1px solid var(--divider);
  padding-top: 6px; padding-bottom: 8px;
}
.search-wrap{
  flex: 1; min-width: 180px;
  position: relative;
  display: flex; align-items: center;
}
.search-wrap svg{
  position: absolute; left: 10px;
  color: var(--muted); pointer-events: none;
}
.search-input{
  width: 100%; padding: 7px 10px 7px 34px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-family: var(--font); font-size: 13px;
  color: var(--val); outline: none;
  transition: border-color .15s;
}
.search-input:focus{ border-color: var(--primary); }
/* ── Dropdown ── */
.dropdown{ position: relative; }
.dropdown-btn{
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 13px; font-weight: 600;
  color: var(--lbl);
  transition: all .15s; white-space: nowrap;
}
.dropdown-btn:hover{ background: var(--divider); }
.dropdown-btn.active{
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}
.dropdown-btn .chevron{ transition: transform .2s; flex-shrink: 0; }
.dropdown-btn.open .chevron{ transform: rotate(180deg); }
.dropdown-panel{
  position: absolute; top: calc(100% + 6px); left: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.13);
  z-index: 300; min-width: 190px;
  display: none; overflow: hidden;
}
.dropdown-panel.open{ display: block; }
.dropdown-search-wrap{
  padding: 8px 10px;
  border-bottom: 1px solid var(--divider);
  display: flex; align-items: center; gap: 7px;
  color: var(--muted);
}
.dropdown-search{
  flex: 1; border: none; outline: none;
  background: transparent;
  font-family: var(--font); font-size: 13px;
  color: var(--val);
}
.dropdown-search::placeholder{ color: var(--muted); }
.dropdown-list{ max-height: 230px; overflow-y: auto; padding: 4px 0; }
.dropdown-item{
  padding: 8px 14px;
  font-size: 13px; color: var(--val);
  cursor: pointer; transition: background .1s;
  display: flex; align-items: center; gap: 9px;
}
.dropdown-item:hover{ background: var(--bg); }
.dropdown-item.selected{ color: var(--primary); font-weight: 700; background: var(--primary-light); }
.item-dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Result summary ── */
.result-bar{
  padding: 10px 16px 4px;
  font-size: 12px; color: var(--lbl);
  display: flex; align-items: center; gap: 6px;
}
.result-bar strong{ color: var(--primary); }

/* ── Card grid ── */
.card-grid{
  padding: 4px 12px 100px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}

/* ── Case card ── */
.case-card{
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  display: flex; flex-direction: column;
}
.case-card:hover{
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.case-card.status-new   { border-left: 3px solid var(--badge-new-txt); }
.case-card.status-proc  { border-left: 3px solid var(--badge-proc-txt); }
.case-card.status-fwd   { border-left: 3px solid var(--badge-fwd-txt); }
.case-card.status-done  { border-left: 3px solid var(--badge-done-txt); }
.case-card.status-grey  { border-left: 3px solid #B8A898; }

.card-thumb{
  width: 100%; aspect-ratio: 16/9;
  background: var(--divider);
  overflow: hidden; flex-shrink: 0;
  position: relative;
}
.card-thumb-media{
  width: 100%; height: 100%;
  position: relative;
}
.card-thumb-media img{
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .3s;
}
.case-card:hover .card-thumb-media img{ transform: scale(1.04); }
.card-thumb-placeholder{
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  background: linear-gradient(135deg, #F0EBE4 0%, #EDE7DF 100%);
}
.no-photo-content{
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.no-photo-emoji{ font-size: 26px; line-height: 1; filter: grayscale(.3); }
.no-photo-text{
  font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .3px;
}
.thumb-view-badge{
  position: absolute; top: 8px; right: 8px; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 999px;
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(226,217,207,.9);
  color: var(--lbl); font-size: 11px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.thumb-view-badge svg{ width: 12px; height: 12px; opacity: .72; }

.card-body{
  padding: 12px 14px 14px;
  flex: 1; display: flex; flex-direction: column;
}
.card-top{
  display: flex; align-items: center;
  gap: 8px;
}
.card-id{
  font-size: 11px; color: var(--muted);
  font-weight: 500; letter-spacing: .4px;
  min-width: 0;
}
.card-top-info{
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--muted);
  white-space: nowrap;
}
.card-top-info svg{ opacity: .6; flex-shrink: 0; }
.card-actions{
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0; margin-left: auto;
}
.card-separator{
  height: 1px; background: var(--divider);
  margin: 8px 0 9px;
}
.badge{
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .2px;
}
.badge-new  { background: var(--badge-new-bg);  color: var(--badge-new-txt); }
.badge-proc { background: var(--badge-proc-bg); color: var(--badge-proc-txt); }
.badge-fwd  { background: var(--badge-fwd-bg);  color: var(--badge-fwd-txt); }
.badge-done { background: var(--badge-done-bg); color: var(--badge-done-txt); }
.badge-grey { background: var(--badge-grey-bg); color: var(--badge-grey-txt); }
.badge-public{
  background: var(--primary-light);
  color: var(--primary-dark);
  border: 1px solid #c5dfc8;
}

.card-title{
  font-size: 14px; font-weight: 700;
  color: var(--heading); line-height: 1.45;
  margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.card-location{
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--lbl);
  line-height: 1.35; margin-bottom: 7px;
  min-height: 18px;
}
.card-location svg{ flex-shrink: 0; opacity: .65; }
.card-location span{
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-meta{
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 8px;
}
/* ── Status group header ── */
.group-header{
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 2px 4px;
}
.group-label{
  font-size: 12px; font-weight: 700;
  color: var(--lbl); letter-spacing: .5px;
  text-transform: uppercase;
}
.group-count{
  font-size: 11px; color: var(--muted);
  background: var(--bg); border: 1px solid var(--divider);
  padding: 1px 7px; border-radius: 999px;
}
.group-line{
  flex: 1; height: 1px; background: var(--divider);
}

/* ── Empty / Error / Loading ── */
.state-wrap{
  grid-column: 1 / -1;
  text-align: center; padding: 60px 24px;
  color: var(--lbl);
}
.state-wrap svg{ margin: 0 auto 16px; opacity: .4; }
.state-wrap h3{ font-size: 16px; color: var(--heading); margin-bottom: 6px; }
.state-wrap p{ font-size: 13px; }

/* Skeleton */
.skel{
  background: linear-gradient(90deg,var(--divider) 25%,#ece6de 50%,var(--divider) 75%);
  background-size: 300% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 5px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
}

/* ── Stats sidebar backdrop ── */
.sidebar-backdrop{
  position: fixed; inset: 0; background: rgba(0,0,0,.3);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.sidebar-backdrop.open{ opacity: 1; pointer-events: auto; }

/* ── Stats sidebar ── */
.stats-sidebar{
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--card);
  border-right: 1px solid var(--border);
  box-shadow: 4px 0 20px rgba(0,0,0,.1);
  z-index: 210;
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.stats-sidebar.open{ transform: translateX(0); }

.sidebar-header{
  padding: 16px 18px 14px;
  border-bottom: 1px solid var(--divider);
  display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
}
.sidebar-header h2{
  font-size: 15px; font-weight: 700;
  color: var(--heading);
}
.sidebar-close{
  width: 30px; height: 30px; border-radius: 50%;
  border: none; background: var(--bg);
  color: var(--lbl); font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.sidebar-close:hover{ background: var(--divider); }

.sidebar-body{
  flex: 1; overflow-y: auto;
  padding: 16px 18px 30px;
  -webkit-overflow-scrolling: touch;
}

/* Stats numbers */
.stat-grid{
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 20px;
}
.stat-box{
  background: var(--bg); border: 1px solid var(--divider);
  border-radius: 8px; padding: 12px 14px;
  text-align: center;
}
.stat-num{
  font-size: 28px; font-weight: 700;
  color: var(--primary); line-height: 1;
  margin-bottom: 4px;
}
.stat-lbl{
  font-size: 11px; color: var(--lbl);
  font-weight: 500;
}

/* Avg days stat */
.stat-row{
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--divider);
  font-size: 13px;
}
.stat-row:last-child{ border-bottom: none; }
.stat-row-lbl{ color: var(--lbl); }
.stat-row-val{ font-weight: 700; color: var(--heading); }
.stat-row-val.warn{ color: #B75D00; }
.stat-row-val.ok{ color: var(--primary); }

/* Chart sections */
.chart-section{
  margin-top: 20px;
}
.chart-title{
  font-size: 12px; font-weight: 700;
  color: var(--lbl); letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.chart-wrap{
  position: relative; width: 100%; height: 180px;
}
.chart-wrap.pie-wrap{ height: 200px; }
.chart-wrap.bar-wrap{ height: 160px; }
.chart-wrap.line-wrap{ height: 150px; }

/* ── 置頂功能 ── */
.pin-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 13px; transition: all .15s;
  cursor: pointer; flex-shrink: 0; padding: 0;
}
.pin-btn svg{ width: 13px; height: 13px; display: block; }
.pin-btn:hover { background: #F5F2EE; border-color: #D6C8BA; color: #8C7B6A; }
.pin-btn.pinned { background: #FFF1F1; border-color: #E57373; color: #C62828; }
.case-card.is-pinned { border-left: 3px solid #F59E0B; }

/* ── 刪除按鈕 ── */
.del-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); transition: all .15s;
  cursor: pointer; flex-shrink: 0; padding: 0; margin-left: auto;
}
.del-btn svg { width: 13px; height: 13px; display: block; }
.del-btn:hover { background: #FFF1F1; border-color: #E57373; color: #C62828; }
.card-actions .del-btn{ margin-left: 0; }

/* ── 拖曳排序 ── */
.group-cards {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}
.sortable-ghost { opacity: 0.3; }
.sortable-drag {
  box-shadow: 0 12px 40px rgba(0,0,0,.25) !important;
  cursor: grabbing !important;
  transform: rotate(0.5deg) scale(1.02);
}

/* ── 批量操作 ── */
.batch-toggle-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
  font-size:13px;font-weight:600;color:var(--lbl);
  white-space:nowrap;transition:all .15s;
}
.batch-toggle-btn:hover{background:var(--divider);border-color:var(--muted);}
.batch-toggle-btn.active{
  background:var(--primary-light);
  border-color:var(--primary);color:var(--primary);
}
.batch-cb-wrap{
  display:none;align-items:center;flex-shrink:0;
}
.batch-mode .batch-cb-wrap{display:flex;}
.batch-cb{
  width:16px;height:16px;cursor:pointer;
  accent-color:var(--primary);flex-shrink:0;
}
.case-card.batch-selected{
  outline:2px solid var(--primary);outline-offset:-2px;
}
.batch-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:150;
  background:#fff;
  border-top:1px solid var(--border);
  box-shadow:0 -4px 24px rgba(0,0,0,.13);
  transform:translateY(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  max-height:65vh;overflow-y:auto;
}
.batch-bar.open{transform:translateY(0);}
.batch-bar-inner{
  padding:8px 14px 10px;
  display:flex;flex-direction:column;gap:7px;
}
.batch-top{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.batch-top-count{font-size:12px;font-weight:700;color:var(--primary);}
.batch-top-btn{
  padding:3px 8px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);
  font-size:11px;font-weight:700;color:var(--lbl);
}
.batch-top-btn:hover{background:var(--divider);}
.batch-fields{
  display:flex;flex-wrap:wrap;gap:7px;
}
.batch-field{
  display:flex;flex-direction:column;gap:4px;
  min-width:160px;
}
.batch-field-row{
  flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap;
}
.batch-status-select{
  padding:4px 7px;width:auto;min-width:90px;
}
.batch-fields-2col{
  flex:1 1 100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.batch-fields-2col .batch-field{min-width:0;}
.batch-fields-2col .batch-field textarea{
  flex:1;min-height:80px;resize:none;
}
.batch-field-label{
  font-size:11px;font-weight:700;color:var(--lbl);
}
.batch-field select{
  padding:5px 8px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg);
  font-family:var(--font);font-size:13px;color:var(--val);
}
.batch-field textarea{
  padding:7px 9px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg);
  font-family:var(--font);font-size:13px;color:var(--val);
  vertical-align:top;
}
.batch-public-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--val);
  cursor:pointer;
}
.batch-actions{display:flex;gap:7px;flex-wrap:wrap;}
.batch-apply-btn{
  padding:7px 16px;border-radius:7px;border:none;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:13px;font-family:var(--font);
  transition:background .15s;
}
.batch-apply-btn:hover{background:var(--primary-dark);}
.batch-apply-btn:disabled{opacity:.5;cursor:not-allowed;}
.batch-exit-btn{
  padding:7px 12px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg);
  font-weight:700;font-size:13px;font-family:var(--font);
  color:var(--lbl);
}
.batch-exit-btn:hover{background:var(--divider);}

/* ── RWD ── */
@media(max-width: 480px){
  .card-grid{
    grid-template-columns: 1fr;
    padding: 4px 10px 80px;
  }
  .group-cards{
    grid-template-columns: 1fr;
  }
  .filter-bar{ flex-wrap: wrap; }
  .stats-sidebar{ width: 100%; max-width: 100%; border-right: none; }

  /* 手機改橫向緊湊列：縮圖左 90px、文字右，一頁可見 6~7 筆 */
  .case-card{ flex-direction: row; }
  .card-thumb{ width: 90px; height: auto; flex-shrink: 0; aspect-ratio: auto; background: var(--card); }
  .card-thumb-media{ height: 90px; }
  .thumb-view-badge{
    position: static;
    width: 100%; min-height: 28px;
    justify-content: center;
    padding: 4px 2px;
    border-width: 1px 0 0;
    border-radius: 0;
    box-shadow: none;
    background: #fff;
    font-size: 10px;
  }
  .card-body{ padding: 7px 10px; min-width: 0; }
  .card-top{ gap: 5px; flex-wrap: wrap; }
  .card-id{ font-size: 10px; }
  .card-top-info{ font-size: 10px; }
  .card-actions{ gap: 5px; }
  .card-separator{ margin: 5px 0 6px; }
  .card-title{ font-size: 13px; margin-bottom: 3px; -webkit-line-clamp: 2; }
  .card-location{ margin-bottom: 4px; font-size: 11px; }
  .card-meta{ margin-bottom: 3px; gap: 4px; }
}
</style>
</head>
<body>

<!-- ── Stats sidebar backdrop ── -->
<div class="sidebar-backdrop" id="backdrop" onclick="closeSidebar()"></div>

<!-- ── Stats sidebar ── -->
<div class="stats-sidebar" id="statsSidebar">
  <div class="sidebar-header">
    <h2>📊 統計總覽</h2>
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="關閉">&#215;</button>
  </div>
  <div class="sidebar-body" id="sidebarBody">
    <div style="text-align:center;padding:40px 0;color:var(--muted);font-size:13px">
      載入中…
    </div>
  </div>
</div>

<!-- ── Page header ── -->
<div class="page-header">
  <button class="stats-toggle-btn" id="statsToggleBtn" onclick="toggleSidebar()">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    統計
  </button>
  <button class="batch-toggle-btn" id="batchToggleBtn" onclick="toggleBatchMode()">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="3" y="5" width="4" height="4" rx="1"/><line x1="10" y1="7" x2="21" y2="7"/>
      <rect x="3" y="13" width="4" height="4" rx="1"/><line x1="10" y1="15" x2="21" y2="15"/>
    </svg>
    批量
  </button>
  <div class="header-title">
    <div>案件清單</div>
    <div class="header-subtitle" id="headerSubtitle">舊社里・里民小幫手</div>
  </div>
  <button class="report-btn" onclick="window.location.href='adminreport.html'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    通報
  </button>
</div>

<!-- ── Filter bar ── -->
<div class="filter-wrap">
<div class="filter-bar">

  <!-- Status dropdown -->
  <div class="dropdown" id="statusDropdown">
    <button class="dropdown-btn" id="statusBtn" onclick="toggleDropdown('statusDropdown')">
      <span id="statusLabel">案件狀態</span>
      <svg class="chevron" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-panel" id="statusPanel">
      <div class="dropdown-search-wrap">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="dropdown-search" placeholder="Search" oninput="filterDropdown('statusList', this.value)">
      </div>
      <div class="dropdown-list" id="statusList">
        <div class="dropdown-item selected" data-value="all"  onclick="selectStatus(this)"><span class="item-dot" style="background:#B8A898"></span>全部狀態</div>
        <div class="dropdown-item" data-value="新案件"        onclick="selectStatus(this)"><span class="item-dot" style="background:#1A56A8"></span>1.新案件</div>
        <div class="dropdown-item" data-value="處理中"        onclick="selectStatus(this)"><span class="item-dot" style="background:#B75D00"></span>2.處理中</div>
        <div class="dropdown-item" data-value="已轉交"        onclick="selectStatus(this)"><span class="item-dot" style="background:#6B28A8"></span>3.已轉交相關單位</div>
        <div class="dropdown-item" data-value="已結案"        onclick="selectStatus(this)"><span class="item-dot" style="background:#2F6836"></span>4.已結案</div>
        <div class="dropdown-item" data-value="不受理"        onclick="selectStatus(this)"><span class="item-dot" style="background:#7A6E66"></span>5.不受理</div>
      </div>
    </div>
  </div>

  <!-- Category dropdown -->
  <div class="dropdown" id="categoryDropdown">
    <button class="dropdown-btn" id="categoryBtn" onclick="toggleDropdown('categoryDropdown')">
      <span id="categoryLabel">通報類別</span>
      <svg class="chevron" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-panel" id="categoryPanel">
      <div class="dropdown-search-wrap">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="dropdown-search" placeholder="Search" oninput="filterDropdown('categoryList', this.value)">
      </div>
      <div class="dropdown-list" id="categoryList">
        <div class="dropdown-item selected" data-value="all" onclick="selectCategory(this)">全部類別</div>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" class="search-input" id="searchInput"
      placeholder="搜尋…" oninput="applyFilters()">
  </div>

</div>
</div><!-- /.filter-wrap -->

<!-- ── Result summary bar ── -->
<div class="result-bar" id="resultBar">
  <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
  載入中…
</div>

<!-- ── Card grid ── -->
<div class="card-grid" id="cardGrid">
  <!-- Skeleton placeholders -->
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:50%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:85%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:65%"></div>
    </div>
  </div>
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:40%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:90%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:70%"></div>
    </div>
  </div>
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:55%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:75%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:60%"></div>
    </div>
  </div>
</div>

<!-- ── 批量操作列 ── -->
<div class="batch-bar" id="batchBar">
  <div class="batch-bar-inner">
    <div class="batch-top">
      <span class="batch-top-count">已選 <strong id="batchCount">0</strong> 筆</span>
      <button class="batch-top-btn" onclick="selectAllFiltered()">全選篩選結果</button>
      <button class="batch-top-btn" onclick="clearBatchSelection()">清除</button>
    </div>
    <div class="batch-fields">
      <div class="batch-field batch-field-row">
        <span class="batch-field-label" style="white-space:nowrap">切換狀態</span>
        <select id="batchStatus" class="batch-status-select">
          <option value="">不變</option>
          <option value="1.新案件">新案件</option>
          <option value="2.處理中">處理中</option>
          <option value="3.已轉交相關單位">已轉交</option>
          <option value="4.已結案">已結案</option>
          <option value="5.不受理">不受理</option>
        </select>
        <label class="batch-public-label">
          <input type="checkbox" id="batchPublicCb">
          已公開
        </label>
      </div>
      <div class="batch-fields-2col">
        <div class="batch-field">
          <div class="batch-field-label">完整回覆內容（空白=不變）</div>
          <textarea id="batchReplyContent" placeholder="請輸入處理情況與回覆內容…"></textarea>
        </div>
        <div class="batch-field">
          <div class="batch-field-label">回覆摘要（空白=不變）</div>
          <textarea id="batchPublicSummary" placeholder="簡短對外說明…"></textarea>
        </div>
      </div>
    </div>
    <div class="batch-actions">
      <button class="batch-apply-btn" id="batchApplyBtn" onclick="batchApply()">套用到已選案件</button>
      <button class="batch-exit-btn" onclick="exitBatchMode()">退出批量模式</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="./shared/list.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
