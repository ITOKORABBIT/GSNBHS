<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>諮詢預約管理｜舊社里</title>
  <link rel="icon" type="image/png" href="./HP_logo.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#162018;--muted:#667168;--line:#dfe6e0;--paper:#f6f8f5;--green:#235c3d;--red:#b42318;--amber:#9a6700}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif}
    .wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
    h1{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
    button.primary{background:var(--green);border-color:var(--green);color:#fff}button:disabled{opacity:.55;cursor:wait}
    .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters button.active{background:#e5efe8;border-color:#94b5a0;color:#174e32}
    .notice{display:none;padding:12px 14px;border-radius:10px;margin-bottom:14px;background:#fff4e5;color:#7a4b00;border:1px solid #efd69e}
    .notice.error{background:#fff0ef;color:var(--red);border-color:#f2b8b5}.grid{display:grid;gap:12px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px rgba(22,32,24,.04)}
    .card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.id{font-size:12px;color:var(--muted);margin-bottom:4px}.title{font-size:18px;font-weight:700}.time{font-size:12px;color:var(--muted);white-space:nowrap}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.field{background:#f7f9f7;border-radius:9px;padding:9px 11px}.label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.value{font-size:14px;word-break:break-word}
    .detail{white-space:pre-wrap;line-height:1.65;border-top:1px solid var(--line);padding-top:13px}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
    .badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.sent{background:#e7f4ea;color:#23653b}.failed{background:#ffebe9;color:var(--red)}.pending{background:#fff4d6;color:var(--amber)}
    select{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font:inherit}.empty{text-align:center;color:var(--muted);padding:50px 20px;background:#fff;border:1px dashed #cbd5cd;border-radius:14px}
    @media(max-width:720px){.top{display:block}.actions{margin-top:14px}.meta{grid-template-columns:1fr}.card-head{display:block}.time{margin-top:6px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><h1>里民諮詢預約</h1><div class="sub">查看預約、處理進度與里長群組通知狀態</div></div>
      <div class="actions"><a class="btn" href="admin.html">回管理首頁</a><button class="primary" onclick="loadConsults()">重新整理</button></div>
    </div>
    <div class="filters" id="filters">
      <button class="active" data-status="" onclick="setFilter(this)">全部</button>
      <button data-status="待處理" onclick="setFilter(this)">待處理</button>
      <button data-status="已聯繫" onclick="setFilter(this)">已聯繫</button>
      <button data-status="已結案" onclick="setFilter(this)">已結案</button>
    </div>
    <div class="notice" id="notice"></div>
    <div class="grid" id="list"><div class="empty">載入中…</div></div>
  </main>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script>
    var currentStatus = '';
    if (!getSession()) location.href = 'admin.html?redirect=' + encodeURIComponent(location.href);

    function api(action, extra) {
      var sess = getSession();
      var payload = Object.assign({ action: action }, extra || {});
      if (sess) {
        payload.sessionToken = sess.sessionToken;
        if (sess.id_token) payload.id_token = sess.id_token;
      }
      return fetch(CONFIG.EVENT_API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
      }).then(async function(res) {
        var json = await res.json().catch(function(){ return { success:false,error:'伺服器回應格式錯誤' }; });
        if (res.status === 401 || json.code === 401) {
          clearSession(); location.href = 'admin.html?redirect=' + encodeURIComponent(location.href);
          throw new Error('登入已逾時');
        }
        if (!res.ok || !json.success) throw new Error(json.error || ('HTTP ' + res.status));
        touchSession(); return json;
      });
    }

    function showNotice(message, isError) {
      var el = document.getElementById('notice');
      el.textContent = message || ''; el.className = 'notice' + (isError ? ' error' : ''); el.style.display = message ? 'block' : 'none';
    }

    function setFilter(button) {
      document.querySelectorAll('#filters button').forEach(function(el){ el.classList.remove('active'); });
      button.classList.add('active'); currentStatus = button.dataset.status || ''; loadConsults();
    }

    async function loadConsults() {
      document.getElementById('list').innerHTML = '<div class="empty">載入中…</div>'; showNotice('');
      try {
        var result = await api('getConsultRequests', currentStatus ? { status: currentStatus } : {});
        render(result.consults || []);
      } catch (error) {
        document.getElementById('list').innerHTML = '<div class="empty">載入失敗</div>'; showNotice(error.message, true);
      }
    }

    function render(items) {
      if (!items.length) { document.getElementById('list').innerHTML = '<div class="empty">目前沒有諮詢預約</div>'; return; }
      document.getElementById('list').innerHTML = items.map(function(c) {
        var notify = c.notifyStatus || 'pending';
        var notifyText = notify === 'sent' ? '群組通知已送達' : notify === 'failed' ? '群組通知失敗' : '群組通知處理中';
        var retry = notify === 'sent' ? '' : '<button onclick="retryNotify(this,\'' + esc(c.consultId) + '\')">重送群組通知</button>';
        return '<article class="card">' +
          '<div class="card-head"><div><div class="id">' + esc(c.consultId) + '</div><div class="title">' + esc(c.category) + '・' + esc(c.name || '未填姓名') + '</div></div><div class="time">' + esc(fmtDateTime(c.submittedAt)) + '</div></div>' +
          '<div class="meta"><div class="field"><span class="label">聯絡電話</span><span class="value"><a href="tel:' + esc(String(c.phone || '').replace(/[^\d+]/g,'')) + '">' + esc(c.phone || '—') + '</a></span></div>' +
          '<div class="field"><span class="label">預約時段</span><span class="value">' + esc(c.timeSlot || '—') + '</span></div>' +
          '<div class="field"><span class="label">備註</span><span class="value">' + esc(c.note || '—') + '</span></div></div>' +
          '<div class="detail">' + esc(c.detail || '—') + '</div>' +
          '<div class="foot"><div><span class="badge ' + esc(notify) + '">' + notifyText + '</span> <span class="sub">嘗試 ' + Number(c.notifyAttempts || 0) + ' 次</span></div>' +
          '<div class="actions">' + retry + '<select aria-label="處理狀態" onchange="changeStatus(this,\'' + esc(c.consultId) + '\')">' +
          ['待處理','已聯繫','已結案'].map(function(s){ return '<option value="' + s + '"' + (s === c.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
          '</select></div></div></article>';
      }).join('');
    }

    async function retryNotify(button, consultId) {
      button.disabled = true; button.textContent = '重送中…'; showNotice('');
      try { await api('retryConsultNotification', { consultId: consultId }); showNotice('群組通知已重新送達'); await loadConsults(); }
      catch (error) { button.disabled = false; button.textContent = '重送群組通知'; showNotice(error.message, true); }
    }

    async function changeStatus(select, consultId) {
      select.disabled = true; showNotice('');
      try { await api('updateConsultStatus', { consultId: consultId, status: select.value }); showNotice('處理狀態已更新'); }
      catch (error) { showNotice(error.message, true); await loadConsults(); }
      finally { select.disabled = false; }
    }

    loadConsults();
  </script>
</body>
</html>
