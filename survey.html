<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>活動問券填寫</title>
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="活動問券填寫">
<meta property="og:description" content="舊社里里民小幫手服務頁面。">
<meta property="og:url" content="https://gsnbhs.pages.dev/survey">
<meta property="og:image" content="https://gsnbhs.pages.dev/圖庫/S__27246628_0.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="484">
<meta property="og:image:height" content="163">
  <style>
    :root { color-scheme: light; }
    body { margin:0; font-family: 'Noto Sans TC', sans-serif; background:#f4f5f8; color:#1f2937; }
    .page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { width:100%; max-width:700px; background:#ffffff; border-radius:18px; box-shadow:0 20px 50px rgba(15,23,42,.08); padding:24px; }
    h1 { margin:0 0 8px; font-size:24px; font-weight:800; letter-spacing:.01em; }
    .subtitle { margin:0 0 20px; color:#475569; line-height:1.7; }
    .subtitle:empty { display:none; }
    .status { margin:0 0 18px; padding:14px 16px; border-radius:14px; background:#eff6ff; color:#1d4ed8; display:none; }
    .status.error { background:#fee2e2; color:#b91c1c; }
    .field { margin-bottom:20px; }
    .field label { display:block; margin-bottom:8px; font-weight:700; color:#334155; }
    .field input[type=text], .field textarea { width:100%; min-height:44px; border:1px solid #cbd5e1; border-radius:12px; padding:12px 14px; font-size:15px; color:#0f172a; background:#fff; box-sizing:border-box; }
    .field textarea { min-height:110px; resize:vertical; }
    .question { margin-bottom:20px; padding:18px 18px 14px; border:1px solid #e2e8f0; border-radius:16px; background:#f8fafc; }
    .question-title { margin:0 0 12px; font-size:15px; font-weight:700; color:#0f172a; }
    .question-title .required { color:#dc2626; margin-left:6px; }
    .option-list { display:grid; gap:10px; }
    .option { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid #cbd5e1; border-radius:12px; background:#ffffff; cursor:pointer; }
    .option input { margin-top:4px; accent-color:#2563eb; }
    .option label { flex:1; line-height:1.6; color:#0f172a; cursor:pointer; }
    .option.other { align-items:center; }
    .option.other input[type=text] { flex:1; min-width:160px; min-height:32px; margin:0; border:0; border-bottom:1.5px solid #94a3b8; border-radius:0; padding:4px 2px; background:transparent; box-shadow:none; }
    .option.other input[type=text]:focus { outline:0 !important; border:0; border-bottom:1.5px solid #2563eb; box-shadow:none; }
    .checkbox-row { display:flex; flex-wrap:wrap; gap:10px; }
    .checkbox-row .option { width:100%; }
    .hint { font-size:13px; color:#64748b; margin-top:8px; }
    .footer { display:flex; flex-direction:column; gap:12px; }
    .submit-btn { width:100%; min-height:52px; border:none; border-radius:14px; background:#2563eb; color:#ffffff; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 12px 20px rgba(37,99,235,.18); }
    .submit-btn:disabled { opacity:.5; cursor:default; box-shadow:none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="pageCard">
      <h1 id="pageTitle">活動問券填寫</h1>
      <p class="subtitle" id="pageSubtitle"></p>
      <div class="status" id="statusBox"></div>
      <form id="surveyForm" style="display:none">
        <div id="surveyIntro"></div>
        <div id="questionList"></div>
        <div class="footer">
          <button type="submit" class="submit-btn" id="submitBtn">送出問券</button>
          <p class="hint">如果您已完成問卷，請勿重複提交。如有問題可回 LINE 查詢。</p>
        </div>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="./shared/survey.js"></script>
</body>
</html>
