<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>活動問券填寫</title>
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="活動問券填寫">
<meta property="og:description" content="舊社里里民小幫手服務頁面。">
<meta property="og:url" content="https://gsnbhs.pages.dev/survey">
<meta property="og:image" content="https://gsnbhs.pages.dev/圖庫/S__27246628_0.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="484">
<meta property="og:image:height" content="163">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/theme.css?v=20260909">
<style>
    :root { color-scheme: light; }
    body { margin:0; font-family: var(--gs-font); background:var(--gs-paper); color:var(--gs-ink); }
    .page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { width:100%; max-width:700px; background:#ffffff; border-radius:var(--gs-radius); box-shadow:var(--gs-shadow-lg); border:1px solid var(--gs-line); padding:24px; }
    h1 { margin:0 0 8px; font-size:24px; font-weight:800; letter-spacing:.01em; }
    .subtitle { margin:0 0 20px; color:var(--gs-ink-soft); line-height:1.7; }
    .subtitle:empty { display:none; }
    .status { margin:0 0 18px; padding:14px 16px; border-radius:var(--gs-radius-sm); background:var(--gs-info-soft); color:var(--gs-info); display:none; }
    .status.error { background:var(--gs-danger-soft); color:var(--gs-danger); }
    .field { margin-bottom:20px; }
    .field label { display:block; margin-bottom:8px; font-weight:700; color:var(--gs-ink); }
    .field input[type=text], .field textarea { width:100%; min-height:44px; border:1px solid var(--gs-line); border-radius:var(--gs-radius-sm); padding:12px 14px; font-size:15px; color:var(--gs-ink); background:#fff; box-sizing:border-box; }
    .field textarea { min-height:110px; resize:vertical; }
    .question { margin-bottom:20px; padding:18px 18px 14px; border:1px solid var(--gs-line); border-radius:var(--gs-radius); background:var(--gs-surface-alt); }
    .question-title { margin:0 0 12px; font-size:15px; font-weight:700; color:var(--gs-ink-strong); }
    .question-title .required { color:var(--gs-danger); margin-left:6px; }
    .option-list { display:grid; gap:10px; }
    .option { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid var(--gs-line); border-radius:var(--gs-radius-sm); background:#ffffff; cursor:pointer; }
    .option input { margin-top:4px; accent-color:var(--gs-green); }
    .option label { flex:1; line-height:1.6; color:var(--gs-ink); cursor:pointer; }
    .option.other { align-items:center; }
    .option.other input[type=text] { flex:1; min-width:160px; min-height:32px; margin:0; border:0; border-bottom:1.5px solid var(--gs-line-strong); border-radius:0; padding:4px 2px; background:transparent; box-shadow:none; }
    .option.other input[type=text]:focus { outline:0 !important; border:0; border-bottom:1.5px solid var(--gs-green); box-shadow:none; }
    .checkbox-row { display:flex; flex-wrap:wrap; gap:10px; }
    .checkbox-row .option { width:100%; }
    .hint { font-size:13px; color:var(--gs-muted); margin-top:8px; }
    .footer { display:flex; flex-direction:column; gap:12px; }
    .submit-btn { width:100%; min-height:52px; border:none; border-radius:var(--gs-radius-sm); background:var(--gs-green); color:#ffffff; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 10px 20px rgba(36,95,73,.18); }
    .submit-btn:disabled { opacity:.5; cursor:default; box-shadow:none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="pageCard">
      <h1 id="pageTitle">活動問券填寫</h1>
      <p class="subtitle" id="pageSubtitle"></p>
      <div class="status" id="statusBox"></div>
      <form id="surveyForm" style="display:none">
        <div id="surveyIntro"></div>
        <div id="questionList"></div>
        <div class="footer">
          <button type="submit" class="submit-btn" id="submitBtn">送出問券</button>
          <p class="hint">如果您已完成問卷，請勿重複提交。如有問題可回 LINE 查詢。</p>
        </div>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="./shared/survey.js"></script>
</body>
</html>
