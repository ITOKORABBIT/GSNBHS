<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft JhengHei',sans-serif;background:#f3f0ea;color:#2b231b;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
  --card:#fff;--border:#e4d9ce;--muted:#8d7968;--text:#2b231b;--heading:#18120d;
  --accent:#b95353;--accent-soft:#fff1ef;
  --green:#2f6836;--green-soft:#eaf3eb;
  --blue:#1a73e8;--blue-soft:#e8f0fe;
  --gold:#9b6112;--gold-soft:#fff4df;
  --gray:#6f645a;--gray-soft:#f2efea;
  --shadow:0 14px 40px rgba(43,35,27,.08);--radius:18px;
}

/* ── 登入畫面 ── */
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(100%,420px);padding:30px 26px;border:1px solid var(--border);border-radius:24px;background:#fff;box-shadow:var(--shadow)}
.login-badge{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;margin-bottom:16px}
.login-title{font-size:28px;font-weight:800;color:var(--heading);margin-bottom:10px}
.login-sub{color:var(--muted);line-height:1.7;margin-bottom:22px}
.login-error{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:14px}

/* ── 主畫面 ── */
.page{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;padding:22px 24px;border:1px solid rgba(228,217,206,.8);border-radius:24px;background:radial-gradient(circle at top right,rgba(185,83,83,.08),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,251,247,.92));box-shadow:var(--shadow)}
.title-wrap h1{font-size:28px;font-weight:800;color:var(--heading);margin-bottom:4px}
.title-wrap p{color:var(--muted);line-height:1.6;font-size:14px}
.top-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ── 按鈕 ── */
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:14px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(43,35,27,.1)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1557b0}
.btn.danger{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:#fbf7f2}
.btn:disabled{opacity:.5;pointer-events:none}

/* ── 統計列 ── */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-chip{padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.stat-chip.green{background:var(--green-soft);border-color:#c8e0cb;color:var(--green)}
.stat-chip.gray{background:var(--gray-soft);border-color:#ddd;color:var(--gray)}
.stat-chip.red{background:var(--accent-soft);border-color:#f0c2c2;color:var(--accent)}

/* ── 篩選列 ── */
.filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:7px 16px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--gray);transition:.15s}
.filter-btn:hover{border-color:var(--blue);color:var(--blue)}
.filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── 卡片 ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.event-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;cursor:grab}
.event-card:hover{transform:translateY(-2px);box-shadow:0 20px 48px rgba(43,35,27,.12)}
.sortable-ghost{opacity:.3}
.sortable-drag{box-shadow:0 12px 40px rgba(0,0,0,.25)!important;cursor:grabbing!important;transform:rotate(.5deg) scale(1.02)}
.card-thumb{width:100%;height:160px;object-fit:cover;background:#f0ece6;display:block}
.card-thumb-placeholder{width:100%;height:160px;background:linear-gradient(135deg,#f0ece6,#e8e0d8);display:flex;align-items:center;justify-content:center;font-size:48px;color:#c4b8aa}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:6px}
.card-name{font-size:16px;font-weight:800;color:var(--heading);line-height:1.4}
.card-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.card-meta span{display:flex;align-items:center;gap:3px}
.card-quota{font-size:12px;font-weight:600;margin-top:2px}
.card-quota.ok{color:var(--green)}
.card-quota.warn{color:var(--gold)}
.card-quota.full{color:var(--accent)}
.card-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── 狀態 badge ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.gray{background:var(--gray-soft);color:var(--gray)}
.badge.red{background:var(--accent-soft);color:var(--accent)}

/* ── 下拉選單 ── */
.status-select{padding:5px 8px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:600;background:#fff;color:var(--text)}

/* ── 空態 ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px;line-height:1.7}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 20px;border-radius:14px;background:#1e1815;color:#fff;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:all .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;place-items:center;padding:20px}
.modal-overlay.open{display:grid}
#editRegModal{z-index:1200}
.modal{background:#fff;border-radius:24px;padding:28px;width:min(100%,440px);box-shadow:0 24px 60px rgba(0,0,0,.18)}
.modal h3{font-size:20px;font-weight:800;margin-bottom:10px}
.modal p{color:var(--muted);line-height:1.7;margin-bottom:20px;font-size:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* ── 報名清單抽屜 ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1100;display:none;place-items:center;padding:20px}
.drawer-overlay.open{display:grid}
.drawer{width:min(96vw,1360px);max-height:min(88vh,800px);background:#fff;z-index:1101;box-shadow:0 24px 70px rgba(0,0,0,.22);display:none;flex-direction:column;border-radius:24px;overflow:hidden}
.drawer.open{display:flex}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-head h2{font-size:18px;font-weight:800}
.drawer-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.drawer-body{flex:1;overflow-y:auto;padding:16px 22px 22px}
.reg-table-wrap{overflow:auto;max-height:58vh;border:1px solid var(--border);border-radius:14px;background:#fff}
.reg-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.reg-table th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:700;white-space:normal;word-break:break-all;background:#fbf7f2;position:sticky;top:0;z-index:2}
.reg-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word;min-width:80px;max-width:220px;line-height:1.55;background:#fff}
.reg-table .reg-action-col{position:sticky;right:0;z-index:3;min-width:72px;max-width:72px;background:#fff;box-shadow:-2px 0 4px rgba(0,0,0,.07)}
.reg-table th.reg-action-col{background:#f4ede5;z-index:4}
.reg-col-checkin{width:48px;min-width:48px;max-width:48px;white-space:nowrap;text-align:center;position:sticky;left:0;z-index:3;background:#fff;box-shadow:2px 0 4px rgba(0,0,0,.07)}
.reg-table th.reg-col-checkin{background:#f4ede5;z-index:4}
.reg-col-reminder{width:48px;min-width:48px;max-width:48px;white-space:nowrap;text-align:center}
.reg-col-name{width:120px;min-width:90px;max-width:150px}
.reg-col-note{width:200px;min-width:170px;max-width:240px}
.reg-col-consent{width:70px;min-width:70px;max-width:70px;text-align:center}
.reg-col-time{width:130px;min-width:130px;max-width:130px;white-space:nowrap;font-size:12px;color:var(--muted)}
.reg-note-input{width:100%;font-size:12px;border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;resize:none;line-height:1.5;color:var(--text);background:#fff;box-sizing:border-box}
.reg-note-input:focus{outline:none;border-color:var(--blue)}
.reg-note-save-btn{margin-top:5px;padding:3px 10px;border-radius:7px;border:1px solid #c7d7fe;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.reg-actions{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.reg-table tr:last-child td{border-bottom:none}
.reg-del-btn{padding:5px 9px;border-radius:8px;border:1px solid #f0c2c2;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap}
.reg-edit-btn{padding:5px 9px;border-radius:8px;border:1px solid #c7d7fe;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700;white-space:nowrap}
.reg-checkin-btn{padding:5px 4px;border-radius:8px;border:1px solid #c8e0cb;background:var(--green-soft);color:var(--green);font-size:16px;font-weight:700;white-space:nowrap;transition:background .12s,color .12s,border-color .12s,transform .08s,box-shadow .12s;display:block;width:100%;text-align:center;line-height:1}
.reg-checkin-btn.checked{background:var(--green);color:#fff;border-color:var(--green)}
.reg-checkin-btn:active{transform:scale(.97)}
.reg-checkin-btn.syncing{box-shadow:0 0 0 3px rgba(47,104,54,.14)}
.reg-del-btn:disabled,.reg-checkin-btn:disabled{opacity:.55;pointer-events:none}
.edit-form{display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow-y:auto;padding-right:2px}
.edit-field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.edit-field input,.edit-field textarea,.edit-field select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:10px;font-size:14px}
.edit-field textarea{min-height:74px;resize:vertical;line-height:1.55}

/* ── 問券管理 Modal ── */
.survey-modal{width:min(100%,1360px);max-height:min(90vh,820px);padding:0;overflow:hidden;display:flex;flex-direction:column}
.survey-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 28px 16px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0}
.survey-modal-body{overflow-y:auto;padding:20px 28px 28px}
.survey-list-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:8px}
.survey-list-item:hover{background:#faf7f2}
.survey-item-name{flex:1;font-size:14px;font-weight:700}
.survey-item-meta{font-size:12px;color:var(--muted)}
.survey-item-actions{display:flex;gap:6px;flex-shrink:0}
.srv-edit-btn{padding:5px 10px;border-radius:8px;border:1px solid #c7d7fe;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700}
.srv-del-btn{padding:4px 8px;border-radius:8px;border:1px solid #fecaca;background:#fff5f5;color:#dc2626;font-size:14px;cursor:pointer;line-height:1}
.srv-del-btn{padding:5px 10px;border-radius:8px;border:1px solid #f0c2c2;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.srv-response-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.srv-response-tools input,.srv-response-tools select{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:13px}
.srv-response-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.srv-chip{padding:5px 10px;border-radius:999px;background:var(--gray-soft);color:var(--gray);font-size:12px;font-weight:800}
.srv-chip.ok{background:var(--green-soft);color:var(--green)}
.srv-chip.warn{background:var(--gold-soft);color:var(--gold)}
.srv-chip.miss{background:var(--accent-soft);color:var(--accent)}
.srv-response-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;max-height:54vh;background:#fff}
.srv-response-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.srv-response-table th{position:sticky;top:0;z-index:2;background:#fbf7f2;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap}
.srv-response-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.55;max-width:260px;word-break:break-word}
.srv-response-table th.answer-col,.srv-response-table td.answer-col{min-width:180px;max-width:260px}
.srv-note-input{width:140px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:12px}
.srv-q-card{background:#f8f5f0;border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;position:relative}
.srv-q-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.srv-q-header select{padding:5px 8px;border-radius:8px;border:1px solid var(--border);font-size:13px;font-weight:600;background:#fff}
.srv-q-num{font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:999px;flex-shrink:0}
.srv-q-remove{margin-left:auto;background:none;border:none;color:var(--accent);font-size:13px;padding:4px 6px;border-radius:6px;cursor:pointer}
.srv-q-remove:hover{color:var(--accent);background:var(--accent-soft)}
.srv-q-text{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:8px;background:#fff;box-sizing:border-box}
.srv-q-text:focus{outline:none;border-color:var(--blue)}
.srv-opt-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.srv-add-opt{font-size:12px;color:var(--blue);background:none;border:none;font-weight:700;padding:2px 0;margin-top:3px}
.srv-add-opt:hover{text-decoration:underline}
.srv-other-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);margin-top:6px}
.srv-other-row input{width:14px;height:14px;accent-color:var(--blue)}
.srv-add-q-btn{border:2px dashed var(--border);background:#faf7f2;border-radius:12px;padding:11px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);width:100%;margin-top:10px;transition:.2s}
.srv-add-q-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

/* ── 報名查詢 Modal ── */
.history-modal{width:min(100%,760px);max-height:min(90vh,860px);display:flex;flex-direction:column}
.history-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.history-table th{text-align:left;padding:9px 12px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:700;background:#fbf7f2;white-space:nowrap;position:sticky;top:0;z-index:2}
.history-table td{padding:9px 12px;border-bottom:1px solid var(--border);word-break:break-word;line-height:1.5}
.history-table tr:last-child td{border-bottom:none}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input{flex:1;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:14px}
.search-row input:focus{outline:none;border-color:var(--blue)}

@media(max-width:600px){
  .topbar{flex-direction:column;align-items:flex-start}
  .cards-grid{grid-template-columns:1fr}
  .drawer-overlay{padding:0}
  .drawer{width:100%;height:100dvh;max-height:100dvh;border-radius:0}
  .drawer-body{padding:10px 8px}
  .reg-table td{padding:8px 8px}
}

/* ── QR Modal ── */
.qr-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:1300;display:none;align-items:center;justify-content:center;
}
.qr-backdrop.open{display:flex;}
.qr-box{
  background:#fff;border-radius:20px;
  padding:24px 24px 20px;width:min(320px,90vw);
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.qr-title{font-size:14px;font-weight:700;color:#1E160E;margin-bottom:4px;line-height:1.4;}
.qr-sub{font-size:12px;color:#8C7B6A;margin-bottom:18px;}
#qrCanvas{display:flex;justify-content:center;margin-bottom:16px;}
#qrCanvas canvas,#qrCanvas img{border-radius:8px;}
.qr-pin-wrap{background:#F5F2EE;border-radius:12px;padding:14px;margin-bottom:16px;}
.qr-pin-label{font-size:11px;color:#8C7B6A;margin-bottom:8px;}
.qr-pin-number{font-size:52px;font-weight:900;color:#1E160E;letter-spacing:10px;line-height:1;}
.qr-btn-row{display:flex;gap:8px;margin-bottom:0;}
.qr-print-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #D4C9BE;background:#fff;font-size:13px;font-weight:600;color:#5C4A35;cursor:pointer;}
.qr-print-btn:hover{background:#F5F2EE;}
.qr-close{flex:1;padding:10px;border-radius:10px;border:1px solid #E2D9CF;background:#F5F2EE;font-size:13px;font-weight:600;color:#8C7B6A;cursor:pointer;}
.qr-close:hover{background:#EDE7DF;}
/* 列印用高解析 QR 容器，平時隱藏 */
#qrPrintCanvas{display:none;}
@media print{
  body>*:not(#qrBackdrop){display:none!important;}
  @page{size:A4 portrait;margin:15mm;}
  #qrBackdrop{position:static!important;background:none!important;display:flex!important;align-items:flex-start;justify-content:center;}
  .qr-box{box-shadow:none!important;border:none!important;width:100%!important;max-width:100%!important;padding:0!important;border-radius:0!important;}
  .qr-btn-row{display:none!important;}
  .qr-title{font-size:36px!important;font-weight:900!important;margin-bottom:6mm!important;color:#1E160E!important;}
  .qr-sub{font-size:18px!important;color:#555!important;margin-bottom:10mm!important;}
  #qrCanvas{display:none!important;}
  #qrPrintCanvas{display:flex!important;justify-content:center!important;width:100%!important;height:auto!important;margin-bottom:10mm!important;}
  #qrPrintCanvas canvas,#qrPrintCanvas img{width:160mm!important;height:160mm!important;border-radius:0!important;image-rendering:pixelated;}
  .qr-pin-wrap{width:100%!important;border-radius:0!important;padding:8mm 0!important;margin-bottom:0!important;background:#f5f5f5!important;}
  .qr-pin-label{font-size:18px!important;margin-bottom:4mm!important;}
  .qr-pin-number{font-size:120px!important;letter-spacing:20px!important;}
}
</style>
</head>
<body>

<!-- ── 登入畫面 ── -->
<div class="login-shell" id="loginShell">
  <div class="login-card">
    <div class="login-badge">🎪 活動報名管理</div>
    <h1 class="login-title">里長後台</h1>
    <p class="login-sub">請使用 Google 帳號登入以管理活動報名。</p>
    <div id="loginBtnWrap"></div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── 主畫面 ── -->
<div class="page" id="mainPage" style="display:none">
  <div class="topbar">
    <div class="title-wrap">
      <h1>🎪 活動報名管理</h1>
      <p>建立活動、管理問券，查看報名資料</p>
    </div>
    <div class="top-actions">
      <button class="btn" style="background:var(--blue-soft);border-color:#c7d7fe;color:var(--blue)" onclick="openHistoryModal()">🔍 報名查詢</button>
      <button class="btn" style="background:var(--green-soft);border-color:#c8e0cb;color:var(--green)" onclick="openSurveyModal()">📋 問券管理</button>
      <button class="btn primary" onclick="goCreate()">＋ 新增活動</button>
    </div>
  </div>

  <!-- 統計 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-chip green" id="statActive">🟢 報名中 0</div>
    <div class="stat-chip gray"  id="statDraft">📝 草稿 0</div>
    <div class="stat-chip red"   id="statClosed">🔴 已截止 0</div>
  </div>

  <!-- 篩選 -->
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" data-filter="報名中" onclick="setFilter('報名中',this)">報名中</button>
    <button class="filter-btn" data-filter="草稿" onclick="setFilter('草稿',this)">草稿</button>
    <button class="filter-btn" data-filter="已截止" onclick="setFilter('已截止',this)">已截止</button>
  </div>

  <!-- 卡片列表 -->
  <div class="cards-grid" id="cardsGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">🎪</div>
    <p>還沒有活動<br>點右上角「新增活動」開始建立</p>
  </div>
</div>

<!-- ── 刪除確認 Modal ── -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>確認刪除？</h3>
    <p id="deleteMsg">刪除後無法還原。</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeDeleteModal()">取消</button>
      <button class="btn danger" id="confirmDeleteBtn" onclick="confirmDelete()">確認刪除</button>
    </div>
  </div>
</div>

<!-- ── 編輯報名 Modal ── -->
<div class="modal-overlay" id="editRegModal">
  <div class="modal" style="width:min(100%,560px)">
    <h3>編輯報名資料</h3>
    <div class="edit-form" id="editRegForm"></div>
    <div class="modal-actions" style="margin-top:18px">
      <button class="btn ghost" onclick="closeEditRegModal()">取消</button>
      <button class="btn primary" id="saveRegBtn" onclick="saveRegistrationEdit()">儲存修改</button>
    </div>
  </div>
</div>

<!-- ── 報名清單抽屜 ── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()">
  <div class="drawer" id="drawer" onclick="event.stopPropagation()">
    <div class="drawer-head">
      <h2 id="drawerTitle">報名名單</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost" style="padding:7px 10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700" title="匯出報名名單 Excel" onclick="exportRegistrationsExcel()">⬇️ 匯出</button>
        <button id="surveyQrBtn" class="btn ghost" style="padding:7px 10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700" title="問券 QR Code" onclick="showSurveyQrModal()">📋 QR</button>
        <button class="btn ghost" style="padding:7px 10px;display:flex;align-items:center;justify-content:center" title="現場報名 QR Code" onclick="addWalkInRegistration()"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/><rect x="14" y="18" width="3" height="3"/></svg></button>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
    </div>
    <div class="drawer-body" id="drawerBody">
      <p style="color:var(--muted);text-align:center;padding:40px">載入中…</p>
    </div>
  </div>
</div>

<!-- ── 問券管理 Modal ── -->
<div class="modal-overlay" id="surveyModal">
  <div class="modal survey-modal">
    <div class="survey-modal-head">
      <h3 id="surveyModalTitle" style="font-size:18px;font-weight:800;color:var(--heading)">📋 問券管理</h3>
      <div style="display:flex;align-items:center;gap:8px">
        <button id="surveyAddBtn" class="btn primary" style="font-size:13px;padding:8px 14px;display:none" onclick="openSurveyEdit(null)">＋ 新增問券</button>
        <button class="drawer-close" onclick="closeSurveyModal()">✕</button>
      </div>
    </div>
    <div class="survey-modal-body" id="surveyModalBody">
      <p style="color:var(--muted);text-align:center;padding:30px">載入中…</p>
    </div>
  </div>
</div>

<!-- ── 報名查詢 Modal ── -->
<div class="modal-overlay" id="historyModal">
  <div class="modal history-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3>🔍 報名記錄查詢</h3>
      <button class="drawer-close" onclick="closeHistoryModal()">✕</button>
    </div>
    <div class="search-row">
      <input type="text" id="historySearchInput" placeholder="輸入姓名或 LINE ID 搜尋…" onkeydown="if(event.key==='Enter')searchHistory()">
      <button class="btn primary" onclick="searchHistory()">搜尋</button>
    </div>
    <div id="historyBody" style="flex:1;overflow-y:auto">
      <p style="text-align:center;color:var(--muted);padding:30px">請輸入姓名或 LINE ID 查詢報名記錄</p>
    </div>
  </div>
</div>

<!-- QR Modal -->
<div class="qr-backdrop" id="qrBackdrop" onclick="closeQrModal()">
  <div class="qr-box" onclick="event.stopPropagation()">
    <div class="qr-title" id="qrModalTitle">現場報名</div>
    <div class="qr-sub" id="qrModalSub">① 掃碼開啟 LINE 官方帳號 → ② 輸入下方報名碼送出</div>
    <div id="qrCanvas"></div>
    <div id="qrPrintCanvas"></div>
    <div class="qr-pin-wrap" id="qrPinWrap">
      <div class="qr-pin-label">步驟 ②｜在 LINE 對話框輸入報名碼送出</div>
      <div class="qr-pin-number" id="qrPin">0000</div>
    </div>
    <div class="qr-btn-row">
      <button class="qr-print-btn" onclick="copyQrModalLink()">複製連結</button>
      <button class="qr-print-btn" onclick="printQrModal()">列印</button>
      <button class="qr-close" onclick="closeQrModal()">關閉</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="./config.js"></script>
<script src="utils.js"></script>
<script src="./shared/eventlist.js"></script>
</body>
</html>
