<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}

body{
  background:var(--gs-paper);
  color:var(--gs-ink);
  font-family:var(--gs-font);
  -webkit-font-smoothing:antialiased;
}
.shell{width:min(1180px,calc(100% - 48px));margin-inline:auto}

/* ── 頁首 ── */
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--gs-line-soft);font-size:13px;font-weight:600;color:var(--gs-muted)}
.back-home{display:inline-flex;align-items:center;gap:7px;transition:color .18s ease}
.back-home:hover{color:var(--gs-green)}
.topbar-stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--gs-font-num)}

.hero{border-bottom:1px solid var(--gs-line);background:var(--gs-paper)}
.hero-inner{padding:38px 0 34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:end}
.hero-kicker{display:flex;align-items:center;gap:12px;color:var(--gs-green);font-size:12px;font-weight:800;letter-spacing:.14em}
.hero-kicker::before{content:"";width:36px;height:1px;background:var(--gs-green)}
.hero h1{margin-top:14px;font-size:clamp(40px,5.6vw,68px);line-height:1.02;letter-spacing:-.05em;font-weight:900;color:var(--gs-ink-strong)}
.hero-lead{max-width:520px;margin-top:16px;color:var(--gs-ink-soft);font-size:15px;line-height:1.9}
.hero-figures{display:flex;gap:34px;padding-bottom:6px}
.figure-n{font:700 34px/1 var(--gs-font-num);letter-spacing:-.04em;color:var(--gs-green)}
.figure-l{margin-top:7px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gs-muted)}

/* ── 搜尋 + 分類導覽 ── */
.browse{position:sticky;top:0;z-index:20;background:var(--gs-paper);border-bottom:1px solid var(--gs-line)}
.browse-inner{padding:14px 0}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:14px;color:var(--gs-faint);pointer-events:none}
.search-input{
  width:100%;min-height:46px;padding:0 14px 0 40px;
  border:1px solid var(--gs-line);border-radius:var(--gs-radius-sm);
  background:var(--gs-surface);color:var(--gs-ink);font:inherit;font-size:15px;
  transition:border-color .18s ease;
}
.search-input::placeholder{color:var(--gs-faint)}
.search-input:focus{outline:0;border-color:var(--gs-green)}
.tiles{display:flex;gap:9px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tiles::-webkit-scrollbar{display:none}
.tile{
  flex-shrink:0;display:inline-flex;align-items:center;gap:8px;
  min-height:40px;padding:0 15px;border:1px solid var(--gs-line);border-radius:var(--gs-radius-pill);
  background:var(--gs-surface);color:var(--gs-ink-soft);
  font-size:14px;font-weight:700;white-space:nowrap;
  transition:border-color .18s ease,background .18s ease,color .18s ease;
}
.tile:hover{border-color:var(--gs-green-line);color:var(--gs-green)}
.tile .n{font-family:var(--gs-font-num);font-size:12px;color:var(--gs-faint)}
.tile[aria-pressed=true]{background:var(--gs-green);border-color:var(--gs-green);color:#fff}
.tile[aria-pressed=true] .n{color:rgba(255,255,255,.7)}

/* ── 名錄 ── */
.directory{padding:26px 0 64px}
.result-bar{display:flex;align-items:baseline;gap:10px;padding-bottom:18px;color:var(--gs-muted);font-size:13px}
.result-bar strong{font-family:var(--gs-font-num);font-size:15px;color:var(--gs-ink)}

.block-head{display:flex;align-items:center;gap:14px;margin:30px 0 16px}
.block-head:first-child{margin-top:0}
.block-head h2{font-size:19px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.block-head .n{font-family:var(--gs-font-num);font-size:13px;color:var(--gs-muted)}
.block-head::after{content:"";flex:1;height:1px;background:var(--gs-line)}

.shops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shop{
  display:grid;grid-template-columns:132px minmax(0,1fr);gap:0;
  background:var(--gs-surface);border:1px solid var(--gs-line);border-radius:var(--gs-radius);
  overflow:hidden;cursor:pointer;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.shop:hover{border-color:var(--gs-green-line);box-shadow:var(--gs-shadow-md);transform:translateY(-2px)}
.shop:focus-visible{outline:2px solid var(--gs-green);outline-offset:3px}
/* 店家圖多半是方形 logo，用 contain 才不會把招牌裁掉一半 */
.shop-figure{position:relative;background:var(--gs-surface-alt);overflow:hidden;border-right:1px solid var(--gs-line-soft)}
.shop-figure img{width:100%;height:100%;object-fit:contain;padding:10px}
.shop-figure .ph{width:100%;height:100%;display:grid;place-items:center}
.shop-views{
  position:absolute;left:7px;bottom:7px;display:inline-flex;align-items:center;gap:4px;
  padding:3px 7px;border-radius:var(--gs-radius-pill);
  background:rgba(28,40,34,.62);color:#fff;font:600 11px/1 var(--gs-font-num);
}
.shop-body{padding:14px 16px 13px;display:flex;flex-direction:column;min-width:0}
.shop-name{font-size:17px;font-weight:800;line-height:1.4;letter-spacing:-.015em}
.shop:hover .shop-name{color:var(--gs-green)}
.shop-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:700}
.tag-brand{border:1px solid transparent}
.shop-lines{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.shop-line{display:flex;align-items:flex-start;gap:7px;color:var(--gs-muted);font-size:12.5px;line-height:1.6}
.shop-line svg{flex-shrink:0;margin-top:3px;color:var(--gs-faint)}
.shop-line span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.shop-offer{
  margin-top:11px;padding:8px 11px;border-left:2px solid var(--gs-green);
  background:var(--gs-green-soft);color:var(--gs-green-dark);
  font-size:12.5px;line-height:1.65;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.shop-offer b{display:block;margin-bottom:2px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gs-green)}
.shop-actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.act{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:34px;border:1px solid var(--gs-line);border-radius:var(--gs-radius-sm);
  color:var(--gs-ink-soft);font-size:12.5px;font-weight:700;
  transition:border-color .18s ease,color .18s ease,background .18s ease;
}
.act:hover{border-color:var(--gs-green);color:var(--gs-green);background:var(--gs-green-soft)}

/* 熱門 */
.hot{padding:22px 0 4px}
.hot-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.hot-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--gs-surface);border:1px solid var(--gs-line);border-radius:var(--gs-radius);cursor:pointer;transition:border-color .18s ease}
.hot-item:hover{border-color:var(--gs-green-line)}
.hot-item:hover .hot-name{color:var(--gs-green)}
.hot-num{width:21px;height:21px;flex-shrink:0;display:grid;place-items:center;border-radius:2px;background:var(--gs-surface-alt);color:var(--gs-ink-soft);font:700 11px/1 var(--gs-font-num)}
.hot-num.r1{background:var(--gs-green);color:#fff}
.hot-num.r2{background:var(--gs-green-mid);color:#fff}
.hot-num.r3{background:var(--gs-surface-deep);color:var(--gs-green-dark)}
.hot-name{font-size:13px;font-weight:700;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 骨架與狀態 */
.skel{background:linear-gradient(90deg,var(--gs-line-soft) 25%,var(--gs-surface-alt) 50%,var(--gs-line-soft) 75%);background-size:300% 100%;animation:shimmer 1.5s infinite;border-radius:2px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel-shop{display:grid;grid-template-columns:132px minmax(0,1fr);background:var(--gs-surface);border:1px solid var(--gs-line);border-radius:var(--gs-radius);overflow:hidden;min-height:168px}
.state{padding:78px 20px;text-align:center;color:var(--gs-muted);grid-column:1/-1}
.state h3{margin-top:16px;font-size:18px;color:var(--gs-ink)}
.state p{margin-top:8px;font-size:14px}
.state svg{margin:0 auto;stroke:var(--gs-line-strong)}

@media(max-width:900px){
  .hero-inner{grid-template-columns:1fr;gap:24px;align-items:start}
  .hero-figures{gap:28px;padding-bottom:0}
  .shops{grid-template-columns:1fr}
  .hot-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .shell{width:calc(100% - 32px)}
  .hero-inner{padding:24px 0 22px}
  .hero h1{font-size:40px}
  .hero-lead{font-size:13.5px;margin-top:12px}
  .figure-n{font-size:27px}
  .figure-l{font-size:11px}
  .hero-figures{gap:22px}
  .browse-inner{padding:11px 0}
  .search-input{min-height:44px;font-size:14px}
  .tile{min-height:36px;padding:0 13px;font-size:13px}
  .directory{padding:20px 0 48px}
  .shop{grid-template-columns:104px minmax(0,1fr)}
  .shop-body{padding:12px 13px 12px}
  .shop-name{font-size:15.5px}
  .shop-line{font-size:12px}
  .shop-offer{font-size:12px;padding:7px 10px}
  .act{font-size:12px;min-height:32px}
  .hot-list{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="browse">

</div>

<div class="shell hot" id="hotBlock" hidden>

<main class="directory">

      <div class="shops">
        <div class="skel-shop"><div class="skel"></div><div style="padding:15px 16px"><div class="skel" style="height:16px;width:62%;margin-bottom:12px"></div><div class="skel" style="height:11px;width:40%;margin-bottom:10px"></div><div class="skel" style="height:11px;width:88%;margin-bottom:7px"></div><div class="skel" style="height:11px;width:70%"></div></div></div>

        <div class="skel-shop"><div class="skel"></div><div style="padding:15px 16px"><div class="skel" style="height:16px;width:58%;margin-bottom:12px"></div><div class="skel" style="height:11px;width:44%;margin-bottom:10px"></div><div class="skel" style="height:11px;width:84%;margin-bottom:7px"></div><div class="skel" style="height:11px;width:66%"></div></div></div>
      </div>
    </div>

</main>

<script src="storeconfig.js"></script>
<script src="utils.js"></script>
