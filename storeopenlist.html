<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="美食地圖 - 舊社里 里民小幫手">
<meta property="og:description" content="舊社里美食地圖">

<link rel="shortcut icon" href="./圖庫/S__27246628_0.jpg?v=20260816">
<link rel="apple-touch-icon" href="./圖庫/S__27246628_0.jpg?v=20260816">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

:root{
  --bg:        #EDF5FF;
  --card:      #FFFFFF;
  --border:    #B8D4EE;
  --divider:   #CCE2F5;
  --lbl:       #456280;
  --val:       #182C44;
  --muted:     #80AACB;
  --heading:   #0E2038;
  --primary:       #4A92C4;
  --primary-light: #E3F2FF;
  --primary-dark:  #3070A0;
  --shadow-sm: 0 1px 3px rgba(20,60,100,.07);
  --shadow-md: 0 2px 8px rgba(20,60,100,.09), 0 1px 2px rgba(20,60,100,.05);
  --radius: 10px;
  --font: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
}

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--val);
  font-size: 15px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ── */
.page-header{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 54px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.header-title{
  flex: 1;
  font-size: 16px; font-weight: 700;
  color: var(--heading);
  text-align: center;
}
.header-subtitle{
  font-size: 12px; font-weight: 400;
  color: var(--lbl); margin-top: 1px;
}
/* ── Filter bar ── */
.filter-wrap{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 54px; z-index: 90;
}
.filter-bar{
  padding: 8px 16px;
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap;
}
.search-wrap{
  flex: 1; min-width: 180px;
  position: relative;
  display: flex; align-items: center;
}
.search-wrap svg{
  position: absolute; left: 10px;
  color: var(--muted); pointer-events: none;
}
.search-input{
  width: 100%; padding: 7px 10px 7px 34px;
  border-radius: 7px; border: 1px solid var(--border);
  background: var(--bg); font-family: var(--font); font-size: 13px;
  color: var(--val); outline: none; transition: border-color .15s;
}
.search-input:focus{ border-color: var(--primary); }

/* ── Category chips ── */
.cate-chips{
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 0 16px 10px;
}
.cate-chip{
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
  border: 1.5px solid transparent;
  cursor: pointer; transition: all .15s; white-space: nowrap;
  background: var(--bg); color: var(--lbl); border-color: var(--border);
}
.cate-chip.active{ border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }

/* ── Result bar ── */
.result-bar{
  padding: 10px 16px 4px;
  font-size: 12px; color: var(--lbl);
}
.result-bar strong{ color: var(--primary); }

/* ── Card grid ── */
.card-grid{
  padding: 4px 12px 100px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}

/* ── Store card ── */
.store-card{
  position: relative;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  display: flex; flex-direction: column;
  border-left: 4px solid var(--primary);
  transition: transform .15s, box-shadow .15s;
}
.store-card:hover{
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.card-thumb{
  width: 100%; aspect-ratio: 16/9;
  background: var(--divider);
  overflow: hidden; flex-shrink: 0; position: relative;
}
.card-thumb img{
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .3s;
}
.store-card:hover .card-thumb img{ transform: scale(1.04); }
.card-thumb-placeholder{
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #DCEEFF 0%, #C8E2F8 100%);
}
.thumb-view-badge{
  position: absolute; top: 8px; right: 8px; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 999px;
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(226,217,207,.9);
  color: var(--lbl); font-size: 11px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.thumb-view-badge svg{ width: 12px; height: 12px; opacity: .72; }

.card-body{
  padding: 9px 11px 11px;
  flex: 1; display: flex; flex-direction: column;
}
.cate-badge{
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 5px;
  font-size: 11px; font-weight: 700;
}
.brand-tag{
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 999px;
  background: #FFF3E0; color: #B75D00;
  font-size: 11px; font-weight: 700;
}
.card-name{
  font-size: 14px; font-weight: 700;
  color: var(--heading); line-height: 1.35;
  margin-bottom: 7px;
}
.card-phone{
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; line-height: 1.45; color: var(--lbl);
  margin-bottom: 7px;
}
.card-phone svg{ width: 11px; height: 11px; flex-shrink: 0; }
.card-address{
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; line-height: 1.45; color: var(--lbl);
  margin-bottom: 7px;
  min-width: 0;
}
.card-address svg{ width: 11px; height: 11px; flex-shrink: 0; }
.card-address-text{
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-meta{ display: flex; flex-wrap: wrap; gap: 6px; }
.card-desc{
  font-size: 12px; color: var(--lbl);
  line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.card-offer-divider{ height: 1px; background: var(--divider); margin-top: 10px; margin-bottom: 8px; }
.card-offer-label{
  display: inline-flex; align-items: center; align-self: flex-start;
  padding: 2px 7px; border-radius: 999px;
  background: var(--primary-light); color: var(--primary-dark);
  font-size: 11px; font-weight: 700; margin-bottom: 5px;
}

/* ── 區塊標題 ── */
.section-header {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 2px 1px;
}
.section-header-label {
  font-size: 12px; font-weight: 700; color: var(--lbl);
  display: flex; align-items: center; gap: 6px;
}
.section-header-line { flex: 1; height: 1px; background: var(--divider); }

/* ── Empty / Loading ── */
.state-wrap{
  grid-column: 1 / -1;
  text-align: center; padding: 60px 24px;
  color: var(--lbl);
}
.state-wrap svg{ margin: 0 auto 16px; opacity: .4; }
.state-wrap h3{ font-size: 16px; color: var(--heading); margin-bottom: 6px; }
.state-wrap p{ font-size: 13px; }

.skel{
  background: linear-gradient(90deg,var(--divider) 25%,#b4d0ea 50%,var(--divider) 75%);
  background-size: 300% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 5px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
}

@media(max-width: 480px){
  .card-grid{ grid-template-columns: 1fr; padding: 4px 10px 80px; }

  /* 手機改橫向緊湊列：縮圖左 90px、文字右，一頁可見 6~7 筆 */
  .store-card{ flex-direction: row; }
  .card-thumb{ width: 90px; height: 90px; flex-shrink: 0; aspect-ratio: auto; }
  .card-body{ padding: 7px 10px; min-width: 0; }
  .card-name{ font-size: 13px; margin-bottom: 4px; }
  .card-phone, .card-address{ margin-bottom: 4px; }
  .card-desc{ -webkit-line-clamp: 1; }
  .card-offer-divider{ margin-top: 7px; margin-bottom: 6px; }
}

/* ── 瀏覽統計 ── */
.stats-row{
  padding:2px 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--lbl);
}
.stats-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 11px;border-radius:999px;border:none;
  background:var(--primary-light);font-size:12px;font-weight:700;
  color:var(--primary-dark);cursor:pointer;transition:background .15s;
}
.stats-btn:hover{background:var(--divider)}
.vm-backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(14,32,56,.38);z-index:500;
  align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(5px);
}
.vm-backdrop.open{display:flex}
.vm-box{
  background:#fff;border-radius:16px;
  width:min(100%,360px);max-height:80vh;overflow:auto;
  box-shadow:0 12px 40px rgba(20,60,100,.18);
}
.vm-head{
  padding:16px 16px 12px;border-bottom:1px solid var(--divider);
  display:flex;align-items:center;justify-content:space-between;
}
.vm-title{font-size:15px;font-weight:700;color:var(--heading)}
.vm-close{
  width:30px;height:30px;border:none;background:var(--bg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:background .15s;
}
.vm-close:hover{background:var(--divider)}
.vm-body{padding:10px 16px 16px}
.vm-empty{text-align:center;color:var(--muted);padding:24px 0;font-size:13px}
.rank-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--divider);
}
.rank-row:last-child{border-bottom:none}
.rank-num{
  width:22px;height:22px;border-radius:50%;
  background:var(--primary);color:#fff;
  font-size:11px;font-weight:700;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.rank-num.r1{background:#e9a21b}
.rank-num.r2{background:#8a8a8a}
.rank-num.r3{background:#a06432}
.rank-name{flex:1;font-size:13px;color:var(--val);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-cnt{font-size:12px;font-weight:700;color:var(--primary);flex-shrink:0;display:flex;align-items:center;gap:2px}
</style>
</head>
<body>

<!-- ── Page header ── -->
<div class="page-header">
  <div style="width:60px"></div>
  <div class="header-title">
    <div>美食地圖</div>

<!-- ── Card grid ── -->

  </div>
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>

      <div class="skel" style="height:12px;width:50%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:75%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:65%"></div>
    </div>
  </div>
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:45%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:85%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:55%"></div>
    </div>
  </div>
</div>

<script src="storeconfig.js"></script>
<script src="utils.js"></script>
<script src="./shared/storeopenlist.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
