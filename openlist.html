<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公開案件 - 舊社里 里民小幫手</title>
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="公開案件 - 舊社里 里民小幫手">
<meta property="og:description" content="舊社里公開案件進度查詢">
<meta property="og:url" content="https://gsnbhs.pages.dev/openlist">
<meta property="og:image" content="https://gsnbhs.pages.dev/圖庫/S__27246628_0.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="484">
<meta property="og:image:height" content="163">

<link rel="shortcut icon" href="./圖庫/S__27246628_0.jpg?v=20260816">
<link rel="apple-touch-icon" href="./圖庫/S__27246628_0.jpg?v=20260816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

:root{
  --bg:#eff8f2;
  --card:#ffffff;
  --border:#bdd9ca;
  --divider:#d0e8da;
  --lbl:#4e7260;
  --val:#1a3028;
  --muted:#86b09e;
  --heading:#112620;
  --primary:#5b9b7b;
  --primary-light:#e6f1ea;
  --primary-dark:#4a8366;
  --shadow-sm:0 1px 3px rgba(30,80,55,.07);
  --shadow-md:0 2px 8px rgba(30,80,55,.09),0 1px 2px rgba(30,80,55,.05);
  --radius:10px;
  --font:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--val);
  font-size:15px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.page-header{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  height:54px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-title{
  flex:1;
  font-size:16px;
  font-weight:700;
  color:var(--heading);
  text-align:center;
}

.header-subtitle{
  font-size:12px;
  font-weight:400;
  color:var(--lbl);
  margin-top:1px;
}

.report-btn{
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 13px;
  border-radius:8px;
  border:none;
  background:#f08080;
  font-size:13px;
  font-weight:600;
  color:#fff;
  transition:background .15s;
  white-space:nowrap;
}

.report-btn:hover{background:#d85c5c}

.filter-wrap{
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:54px;
  z-index:90;
}

.filter-bar{
  padding:8px 16px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.search-wrap{
  flex:1;
  min-width:180px;
  position:relative;
  display:flex;
  align-items:center;
}

.search-wrap svg{
  position:absolute;
  left:10px;
  color:var(--muted);
  pointer-events:none;
}

.search-input{
  width:100%;
  padding:7px 10px 7px 34px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--bg);
  font-family:var(--font);
  font-size:13px;
  color:var(--val);
  outline:none;
  transition:border-color .15s;
}

.search-input:focus{border-color:var(--primary)}

.dropdown{position:relative}

.dropdown-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  font-size:13px;
  font-weight:600;
  color:var(--lbl);
  transition:all .15s;
  white-space:nowrap;
}

.dropdown-btn:hover{background:var(--divider)}
.dropdown-btn.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.dropdown-btn .chevron{transition:transform .2s;flex-shrink:0}
.dropdown-btn.open .chevron{transform:rotate(180deg)}

.dropdown-panel{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.13);
  z-index:300;
  min-width:170px;
  display:none;
  overflow:hidden;
}

.dropdown-panel.open{display:block}
.dropdown-list{max-height:230px;overflow-y:auto;padding:4px 0}

.dropdown-item{
  padding:8px 14px;
  font-size:13px;
  color:var(--val);
  cursor:pointer;
  transition:background .1s;
}

.dropdown-item:hover{background:var(--bg)}
.dropdown-item.selected{color:var(--primary);font-weight:700;background:var(--primary-light)}

.result-bar{
  padding:10px 16px 4px;
  font-size:12px;
  color:var(--lbl);
}

.result-bar strong{color:var(--primary)}

.card-grid{
  padding:4px 12px 100px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:12px;
}

.case-card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  display:flex;
  flex-direction:column;
  border-left:4px solid var(--primary);
}

.case-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.card-thumb{
  width:100%;
  aspect-ratio:16/9;
  background:var(--divider);
  overflow:hidden;
  flex-shrink:0;
  position:relative;
}

.card-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .3s;
}

.case-card:hover .card-thumb img{transform:scale(1.04)}

.card-thumb-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#d8eee2 0%,#c8e4d5 100%);
}

.card-body{
  padding:12px 14px 14px;
  flex:1;
  display:flex;
  flex-direction:column;
}

.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding-bottom:8px;
  margin-bottom:8px;
  border-bottom:1px solid var(--divider);
  font-size:11px;
  color:var(--muted);
}

.card-date{
  display:inline-flex;
  align-items:center;
  min-width:0;
}

.card-title{
  font-size:14px;
  font-weight:700;
  color:var(--heading);
  line-height:1.45;
  margin-bottom:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-location{
  font-size:12px;
  color:var(--lbl);
  line-height:1.5;
  margin-bottom:8px;
  min-height:18px;
  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-tags{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.state-wrap{
  grid-column:1 / -1;
  text-align:center;
  padding:60px 24px;
  color:var(--lbl);
}

.state-wrap svg{margin:0 auto 16px;opacity:.4}
.state-wrap h3{font-size:16px;color:var(--heading);margin-bottom:6px}
.state-wrap p{font-size:13px}

.skel{
  background:linear-gradient(90deg,var(--divider) 25%,#c2ddd0 50%,var(--divider) 75%);
  background-size:300% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:5px;
}

@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.skel-card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  overflow:hidden;
}

@media(max-width:480px){
  .card-grid{grid-template-columns:1fr;padding:4px 10px 80px}
  .filter-bar{flex-wrap:wrap}

  /* 手機改橫向列：固定卡片高度，照片放大但不撐版 */
  .case-card{flex-direction:row;height:116px}
  .card-thumb{width:110px;height:100%;flex-shrink:0;aspect-ratio:auto}
  .card-body{padding:7px 10px;min-width:0;overflow:hidden}
  .card-top{margin-bottom:3px}
  .card-title{font-size:13px;margin-bottom:3px;-webkit-line-clamp:2}
  .card-location{margin-bottom:5px}
}

/* ── 瀏覽統計 ── */
.stats-row{
  padding:2px 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--lbl);
}
.stats-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 11px;border-radius:999px;border:none;
  background:var(--primary-light);font-size:12px;font-weight:700;
  color:var(--primary-dark);cursor:pointer;transition:background .15s;
}
.stats-btn:hover{background:var(--divider)}
.vc-badge{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.vm-backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(17,38,32,.38);z-index:500;
  align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(5px);
}
.vm-backdrop.open{display:flex}
.vm-box{
  background:#fff;border-radius:16px;
  width:min(100%,360px);max-height:80vh;overflow:auto;
  box-shadow:0 12px 40px rgba(17,38,32,.18);
}
.vm-head{
  padding:16px 16px 12px;border-bottom:1px solid var(--divider);
  display:flex;align-items:center;justify-content:space-between;
}
.vm-title{font-size:15px;font-weight:700;color:var(--heading)}
.vm-close{
  width:30px;height:30px;border:none;background:var(--bg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:background .15s;
}
.vm-close:hover{background:var(--divider)}
.vm-body{padding:10px 16px 16px}
.vm-empty{text-align:center;color:var(--muted);padding:24px 0;font-size:13px}
.rank-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--divider);
}
.rank-row:last-child{border-bottom:none}
.rank-num{
  width:22px;height:22px;border-radius:50%;
  background:var(--primary);color:#fff;
  font-size:11px;font-weight:700;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.rank-num.r1{background:#e9a21b}
.rank-num.r2{background:#8a8a8a}
.rank-num.r3{background:#a06432}
.rank-name{flex:1;font-size:13px;color:var(--val);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-cnt{font-size:12px;font-weight:700;color:var(--primary);flex-shrink:0;display:flex;align-items:center;gap:2px}
</style>
</head>
<body>

<div class="page-header">
  <div style="width:60px"></div>
  <div class="header-title">
    <div>公開案件</div>
    <div class="header-subtitle" id="headerSubtitle">舊社里 里民小幫手</div>
  </div>
  <button class="report-btn" onclick="window.location.href='report.html'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    我要通報
  </button>
</div>

<div class="filter-wrap">
  <div class="filter-bar">
    <div class="dropdown" id="categoryDropdown">
      <button class="dropdown-btn" id="categoryBtn" onclick="toggleDropdown('categoryDropdown')">
        <span id="categoryLabel">全部類別</span>
        <svg class="chevron" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dropdown-panel">
        <div class="dropdown-list" id="categoryList">
          <div class="dropdown-item selected" data-value="all" onclick="selectCategory(this)">全部類別</div>
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="搜尋案件…" oninput="applyFilters()">
    </div>
  </div>
</div>

<div class="result-bar" id="resultBar">載入中…</div>

<div class="stats-row" id="statsRow" style="display:none">
  <span style="display:inline-flex;align-items:center;gap:4px">
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span id="pageViewCount">–</span> 次瀏覽
  </span>
  <button class="stats-btn" onclick="openVmModal()">🔥 熱門排行</button>
</div>
<div class="vm-backdrop" id="vmBackdrop" onclick="closeVmModal(event)">
  <div class="vm-box">
    <div class="vm-head">
      <div class="vm-title">🔥 最多點閱 TOP 5</div>
      <button class="vm-close" onclick="closeVmModalDirect()"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="vm-body" id="vmBody"></div>
  </div>
</div>

<div class="card-grid" id="cardGrid">
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:50%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:85%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:65%"></div>
    </div>
  </div>
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:40%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:90%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:70%"></div>
    </div>
  </div>
  <div class="skel-card" style="height:220px">
    <div class="skel" style="height:130px;border-radius:0"></div>
    <div style="padding:12px 14px">
      <div class="skel" style="height:12px;width:55%;margin-bottom:8px"></div>
      <div class="skel" style="height:15px;width:75%;margin-bottom:6px"></div>
      <div class="skel" style="height:12px;width:60%"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="./shared/openlist.js"></script>
<script src="./branding-footer.js"></script>
</body>
</html>
