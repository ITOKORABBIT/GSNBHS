<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>里民諮詢服務預約 - 舊社里 里民小幫手</title>
<link rel="icon" type="image/png" href="./HP_logo.png?v=5">
<link rel="shortcut icon" href="./HP_logo.png?v=5">
<link rel="apple-touch-icon" href="./HP_logo.png?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green-50:  #F4F9F5;
  --green-100: #E6F1EA;
  --green-300: #A8CDB6;
  --green-500: #5B9B7B;
  --green-600: #4A8568;
  --green-700: #3A6952;
  --green-800: #2D5240;
  --ink-700: #4A5C52;
  --ink-500: #6B7C73;
  --ink-300: #9CADAB;
  --danger: #DC2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  color: var(--green-800);
  background: var(--green-50);
  padding: 0 0 40px;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}
.hero {
  background: linear-gradient(160deg, #7BB596 0%, #5B9B7B 100%);
  color: #fff; padding: 28px 20px 24px; text-align: center;
}
.hero h1 { font-size: 20px; font-weight: 700; }
.hero p { font-size: 13px; opacity: .92; margin-top: 6px; }
.wrap { max-width: 560px; margin: -14px auto 0; padding: 0 16px; }
.card {
  background: #fff; border-radius: 16px; padding: 20px;
  box-shadow: 0 4px 16px rgba(45,82,64,.08); margin-bottom: 16px;
}
.field { margin-bottom: 20px; }
.field:last-child { margin-bottom: 0; }
label.lbl { display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.req { color: var(--danger); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--ink-500); margin-bottom: 8px; }
input[type=text], input[type=tel], textarea {
  width: 100%; padding: 11px 13px; font-size: 15px; font-family: inherit;
  border: 1.5px solid var(--green-300); border-radius: 10px; background: #fff; color: var(--green-800);
}
input:focus, textarea:focus { outline: none; border-color: var(--green-500); }
input.invalid, textarea.invalid { border-color: var(--danger); background: #FEF2F2; }
textarea { resize: vertical; min-height: 90px; }
::placeholder { color: var(--ink-300); }
.opt {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; margin-bottom: 8px;
  border: 1.5px solid var(--green-300); border-radius: 10px; cursor: pointer; background: #fff;
  font-size: 14.5px; transition: .15s;
}
.opt:last-child { margin-bottom: 0; }
.opt input { margin-top: 3px; accent-color: var(--green-600); flex-shrink: 0; }
.opt:has(input:checked) { border-color: var(--green-500); background: var(--green-100); font-weight: 500; }
.opt-group.invalid .opt { border-color: var(--danger); }
.err { color: var(--danger); font-size: 12.5px; margin-top: 6px; display: none; }
.err.show { display: block; }
.btn {
  width: 100%; padding: 14px; font-size: 16px; font-weight: 700; font-family: inherit;
  color: #fff; background: var(--green-600); border: none; border-radius: 12px; cursor: pointer;
}
.btn:disabled { opacity: .6; cursor: not-allowed; }
.notice {
  background: var(--green-100); border-left: 3px solid var(--green-500);
  padding: 11px 13px; border-radius: 8px; font-size: 13px; color: var(--green-700); margin-bottom: 18px;
}
.done { text-align: center; padding: 36px 20px; display: none; }
.done .tick { font-size: 46px; }
.done h2 { font-size: 19px; margin: 12px 0 8px; }
.done p { font-size: 14px; color: var(--ink-700); }
.done .id { font-family: monospace; font-size: 13px; color: var(--ink-500); margin-top: 12px; }
</style>
</head>
<body>

<div class="hero">
  <h1>里民諮詢服務預約</h1>
  <p>舊社里辦公室・里長 謝秉憲</p>
</div>

<div class="wrap">
  <div class="card" id="formCard">
    <div class="notice">
      為確保預約品質，諮詢時間請於<strong>三天前</strong>填寫。<br>
      您填寫的內容僅由里長與里辦公室查看，不會公開。
    </div>

    <form id="f" novalidate>
      <div class="field">
        <label class="lbl" for="q_name">姓名</label>
        <div class="hint">方便里長稱呼您，可填 LINE 暱稱</div>
        <input type="text" id="q_name" placeholder="您的姓名或暱稱" maxlength="50">
      </div>

      <div class="field">
        <label class="lbl" for="q_phone">聯絡電話 <span class="req">*</span></label>
        <input type="tel" id="q_phone" inputmode="tel" placeholder="手機或市話" maxlength="30">
        <div class="err" id="e_phone">請留下正確的聯絡電話</div>
      </div>

      <div class="field">
        <label class="lbl">諮詢類別 <span class="req">*</span></label>
        <div class="opt-group" id="g_cate">
          <label class="opt"><input type="radio" name="cate" value="法律諮詢"><span>法律諮詢</span></label>
          <label class="opt"><input type="radio" name="cate" value="清寒協助"><span>清寒協助</span></label>
          <label class="opt"><input type="radio" name="cate" value="其它"><span>其它（請於下方說明）</span></label>
        </div>
        <div class="err" id="e_cate">請選擇諮詢類別</div>
      </div>

      <div class="field">
        <label class="lbl" for="q_detail">諮詢事項說明 <span class="req">*</span></label>
        <div class="hint">請簡述您要諮詢的內容，讓里長事先了解狀況</div>
        <textarea id="q_detail" placeholder="請描述您的狀況..." maxlength="1000"></textarea>
        <div class="err" id="e_detail">請填寫諮詢事項說明</div>
      </div>

      <div class="field">
        <label class="lbl">預約時段 <span class="req">*</span></label>
        <div class="hint">法律諮詢僅開放週一、週二及週五 18:00~20:00；其他服務項目請參考以下時間</div>
        <div class="opt-group" id="g_slot">
          <label class="opt"><input type="radio" name="slot" value="(吳秉翰 律師)週一 18:00~20:00"><span>（吳秉翰 律師）週一 18:00~20:00</span></label>
          <label class="opt"><input type="radio" name="slot" value="(陳宗翰 律師)週二 18:00~20:00"><span>（陳宗翰 律師）週二 18:00~20:00</span></label>
          <label class="opt"><input type="radio" name="slot" value="(王東元 律師)週五 18:00~20:00"><span>（王東元 律師）週五 18:00~20:00</span></label>
          <label class="opt"><input type="radio" name="slot" value="上午 08:00~12:00"><span>上午 08:00~12:00</span></label>
          <label class="opt"><input type="radio" name="slot" value="下午 14:00~17:00"><span>下午 14:00~17:00</span></label>
          <label class="opt"><input type="radio" name="slot" value="晚上 19:00~22:00"><span>晚上 19:00~22:00</span></label>
        </div>
        <div class="err" id="e_slot">請選擇預約時段</div>
      </div>

      <div class="field">
        <label class="lbl" for="q_note">備註事項</label>
        <textarea id="q_note" placeholder="其他想補充的事項（選填）" maxlength="500" style="min-height:70px"></textarea>
      </div>

      <button type="submit" class="btn" id="btn">送出預約</button>
    </form>
  </div>

  <div class="card done" id="doneCard">
    <div class="tick">✅</div>
    <h2>預約已送出</h2>
    <p>里長收到後會盡快與您聯繫確認時間，感謝您的耐心等候。</p>
    <div class="id" id="doneId"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
// 從 LINE 進來時網址會帶身分參數，一併送出讓里長知道是誰預約的（填表者看不到）
var LINE_ID = '', LINE_NAME = '';
(function () {
  var q = new URLSearchParams(location.search);
  LINE_ID = q.get('lineUserId') || '';
  LINE_NAME = q.get('displayName') || '';
})();

function val(id) { return document.getElementById(id).value.trim(); }
function radio(name) {
  var el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : '';
}
function setErr(errId, groupEl, bad) {
  document.getElementById(errId).classList.toggle('show', bad);
  if (groupEl) groupEl.classList.toggle('invalid', bad);
}

document.querySelectorAll('input, textarea').forEach(function (el) {
  el.addEventListener('input', function () { this.classList.remove('invalid'); });
});

document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var phone = val('q_phone'), detail = val('q_detail');
  var cate = radio('cate'), slot = radio('slot');
  var ok = true;

  var badPhone = phone.replace(/[^\d]/g, '').length < 8;
  setErr('e_phone', null, badPhone);
  document.getElementById('q_phone').classList.toggle('invalid', badPhone);
  if (badPhone) ok = false;

  setErr('e_cate', document.getElementById('g_cate'), !cate);
  if (!cate) ok = false;

  setErr('e_detail', null, !detail);
  document.getElementById('q_detail').classList.toggle('invalid', !detail);
  if (!detail) ok = false;

  setErr('e_slot', document.getElementById('g_slot'), !slot);
  if (!slot) ok = false;

  if (!ok) return;

  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  try {
    var res = await fetch(CONFIG.EVENT_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'submitConsult',
        name: val('q_name'), phone: phone,
        category: cate, detail: detail, timeSlot: slot, note: val('q_note'),
        lineUserId: LINE_ID, lineDisplayName: LINE_NAME
      })
    });
    var json = await res.json();
    if (!json.success) throw new Error(json.error || '送出失敗');
    document.getElementById('formCard').style.display = 'none';
    var done = document.getElementById('doneCard');
    done.style.display = 'block';
    document.getElementById('doneId').textContent = '預約編號：' + (json.consultId || '');
    window.scrollTo(0, 0);
  } catch (err) {
    alert('送出失敗：' + err.message + '\n請稍後再試，或直接於 LINE 留言給里長。');
    btn.disabled = false;
    btn.textContent = '送出預約';
  }
});
</script>
</body>
</html>
