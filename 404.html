<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>頁面不存在</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/theme.css?v=20260909">
<style>body{margin:0;font-family:var(--gs-font);background:var(--gs-paper);color:var(--gs-ink);display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px}h1{margin:0;font-size:28px;}p{margin:12px 0 0;color:var(--gs-muted);}</style>
</head>
<body>
  <script>
    var path = location.pathname || '';
    var file = path.split('/').filter(Boolean).pop() || '';
    if (/^survey[0-9A-Za-z_-]*\.html$/i.test(file) && file.toLowerCase() !== 'survey.html') {
      var query = location.search || '';
      var separator = query ? '&' : '?';
      window.location.replace('/survey' + query + separator + 'surveyFileName=' + encodeURIComponent(file));
    } else {
      document.body.innerHTML = '<div><h1>找不到頁面</h1><p>您欲訪問的頁面不存在。</p></div>';
    }
  </script>
</body>
</html>
